<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Data Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --paper:        #F3F5F4;
  --paper-sunk:   #E8EDEB;
  --grid:         #D6DEDB;
  --rule:         #C2CCC9;
  --rule-strong:  #8A9A96;

  --ink:          #16232E;
  --ink-2:        #47585F;
  --ink-3:        #7C8C90;

  --signal:       #0F6E63;
  --signal-lift:  #12897C;
  --signal-wash:  #DCEBE8;
  --crimson:      #B3123A;
  --amber:        #C7860B;
  --lilac:        #6E5AC8;
  --strontium:    #D4453B;
  --barium:       #4E9A2F;

  --cat-alkali:        #F6D9D0; --cat-alkali-edge:      #C25A3E;
  --cat-alkaline:      #F8E7C8; --cat-alkaline-edge:    #C08A22;
  --cat-transition:    #DCE7EC; --cat-transition-edge:  #547A8E;
  --cat-post-trans:    #E2E6DE; --cat-post-trans-edge:  #6E7B63;
  --cat-metalloid:     #E5DFF2; --cat-metalloid-edge:   #6E5AC8;
  --cat-nonmetal:      #D9EDDF; --cat-nonmetal-edge:    #35774A;
  --cat-halogen:       #D6EAF0; --cat-halogen-edge:     #2C7C93;
  --cat-noble:         #EDDDE8; --cat-noble-edge:       #8E4A78;
  --cat-lanthanide:    #F1E3D5; --cat-lanthanide-edge:  #A9722F;
  --cat-actinide:      #EEDCDC; --cat-actinide-edge:    #9C4444;
  --cat-unknown:       #E4E7E8; --cat-unknown-edge:     #7C8C90;

  --font-ui:   "Archivo", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;

  --t-xs:  0.75rem;
  --t-sm:  0.875rem;
  --t-base:1rem;
  --t-md:  1.25rem;
  --t-lg:  1.563rem;
  --t-xl:  1.953rem;
  --t-2xl: 3.052rem;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --radius-tile: 2px;
  --radius-panel: 0;
  --radius-control: 6px;

  --shadow-card: 0 8px 28px rgba(22,35,46,.16);
  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:      #10262A;
    --paper-sunk: #0B1D21;
    --grid:       #1C3A3F;
    --rule:       #24474D;
    --rule-strong:#3E6B71;
    --ink:        #E4EFEC;
    --ink-2:      #A3BAB6;
    --ink-3:      #6E8A87;
    --signal:     #4FC7B6;
    --signal-lift:#6FDCCB;
    --signal-wash:#123B3B;
    --crimson:    #FF7A93;
    --amber:      #F0B44A;
    --lilac:      #A996F0;
    --strontium:  #FF7A6B;
    --barium:     #86D45F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:      #10262A;
  --paper-sunk: #0B1D21;
  --grid:       #1C3A3F;
  --rule:       #24474D;
  --rule-strong:#3E6B71;
  --ink:        #E4EFEC;
  --ink-2:      #A3BAB6;
  --ink-3:      #6E8A87;
  --signal:     #4FC7B6;
  --signal-lift:#6FDCCB;
  --signal-wash:#123B3B;
  --crimson:    #FF7A93;
  --amber:      #F0B44A;
  --lilac:      #A996F0;
  --strontium:  #FF7A6B;
  --barium:     #86D45F;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .cat-tile{ --cat-fill-mix: 22%; }
}
:root[data-theme="dark"] .cat-tile{ --cat-fill-mix: 22%; }

/* ============================= BASE ============================= */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--font-ui);
  font-size:var(--t-base);
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,dl,dd{ margin:0; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
a{ color:var(--signal); }
::selection{ background:var(--signal-wash); color:var(--ink); }

:focus-visible{
  outline:2px solid var(--signal);
  outline-offset:2px;
  border-radius:2px;
}
:focus:not(:focus-visible){ outline:none; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.001ms !important;
  }
}

.tabular{ font-variant-numeric: tabular-nums lining-nums; }

/* ============================= LAYOUT ============================= */
.app{
  display:grid;
  grid-template-columns:64px minmax(0,1fr);
  grid-template-rows:56px 1fr;
  grid-template-areas:
    "bar bar"
    "rail main";
  height:100vh;
}

/* graph-paper ground */
#desk{
  grid-area:main;
  position:relative;
  overflow-y:auto;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:20px 20px;
  background-position:-1px -1px;
}
:root:not([data-theme="light"]) #desk{
  background-image:
    linear-gradient(color-mix(in oklab, var(--grid) 55%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in oklab, var(--grid) 55%, transparent) 1px, transparent 1px);
}

.desk-inner{
  max-width:1400px;
  margin:0 auto;
  padding:var(--s5) var(--s5) var(--s7);
}

/* command bar */
.bar{
  grid-area:bar;
  display:flex;
  align-items:center;
  gap:var(--s4);
  padding:0 var(--s4);
  background:var(--paper);
  border-bottom:2px solid var(--ink);
  position:sticky;
  top:0;
  z-index:40;
}
.bar-brand{
  font-weight:700;
  font-size:var(--t-sm);
  letter-spacing:0.02em;
  white-space:nowrap;
  color:var(--ink);
}
.bar-search{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:var(--s2);
  background:var(--paper-sunk);
  border:1px solid var(--rule);
  border-radius:var(--radius-control);
  padding:0 var(--s3);
  height:36px;
  max-width:560px;
}
.bar-search input{
  flex:1;
  min-width:0;
  width:0;
  background:none;
  border:none;
  color:var(--ink);
  font-size:var(--t-sm);
}
@media (max-width:480px){
  .bar-brand{ display:none; }
  .bar-search kbd{ display:none; }
}
.bar-search input::placeholder{ color:var(--ink-3); }
.bar-search kbd{
  font-family:var(--font-ui);
  font-size:var(--t-xs);
  color:var(--ink-3);
  border:1px solid var(--rule);
  border-radius:4px;
  padding:1px 5px;
  background:var(--paper);
}
.bar-actions{ display:flex; align-items:center; gap:var(--s2); margin-left:auto; }
.icon-btn{
  width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  background:none; border:1px solid transparent; border-radius:var(--radius-control);
  color:var(--ink-2);
}
.icon-btn:hover{ background:var(--paper-sunk); color:var(--ink); }
.icon-btn svg{ width:18px; height:18px; }

/* rail */
.rail{
  grid-area:rail;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  background:var(--paper-sunk);
  border-right:1px solid var(--rule);
  padding:var(--s3) 0;
}
.rail-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:var(--s3) 0;
  background:none;
  border:none;
  border-left:3px solid transparent;
  color:var(--ink-2);
  position:relative;
}
.rail-item svg{ width:20px; height:20px; }
.rail-item .rail-label{ font-size:10px; font-weight:600; letter-spacing:0.02em; }
.rail-item:hover{ color:var(--ink); background:color-mix(in oklab, var(--paper) 50%, transparent); }
.rail-item[aria-current="true"]{
  color:var(--accent, var(--signal));
  border-left-color:var(--accent, var(--signal));
  background:var(--paper);
}
.rail-spacer{ flex:1; }

/* panels */
.panel{ display:none; }
.panel[data-active="true"]{ display:block; }
.panel-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:var(--s4);
  flex-wrap:wrap;
  padding-bottom:var(--s3);
  border-bottom:1px solid var(--rule);
  margin-bottom:var(--s4);
}
.panel-title{
  font-size:var(--t-lg);
  font-weight:600;
  color:var(--ink);
}
.panel-title .accent-mark{ color:var(--accent, var(--signal)); }
.panel-tools{ display:flex; gap:var(--s2); flex-wrap:wrap; align-items:center; }

.sheet{
  background:var(--paper);
  border:1px solid var(--rule);
}
.sheet + .sheet{ margin-top:var(--s4); }
.sheet-head{
  padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--rule);
  font-weight:600;
  font-size:var(--t-sm);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--s3);
}
.sheet-body{ padding:var(--s4); }

/* segmented control (chem/phys/maths sub-nav) */
.segmented{
  display:flex;
  flex-wrap:wrap;
  gap:2px;
  background:var(--paper-sunk);
  border:1px solid var(--rule);
  padding:2px;
  margin-bottom:var(--s4);
}
.segmented button{
  background:none;
  border:none;
  padding:var(--s2) var(--s3);
  font-size:var(--t-sm);
  font-weight:500;
  color:var(--ink-2);
  border-radius:2px;
}
.segmented button:hover{ color:var(--ink); }
.segmented button[aria-selected="true"]{
  background:var(--paper);
  color:var(--accent, var(--signal));
  box-shadow:inset 0 0 0 1px var(--rule);
  font-weight:600;
}

/* form controls */
.field{ display:flex; flex-direction:column; gap:4px; }
.field label{ font-size:var(--t-xs); color:var(--ink-2); font-weight:500; }
input[type="text"], input[type="number"], input[type="search"], select, textarea{
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:var(--radius-control);
  padding:var(--s2) var(--s3);
  font-size:var(--t-sm);
  color:var(--ink);
}
textarea{ font-family:var(--font-ui); resize:vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{ outline-offset:1px; }
.btn{
  background:var(--paper);
  border:1px solid var(--rule-strong);
  border-radius:var(--radius-control);
  padding:var(--s2) var(--s4);
  font-size:var(--t-sm);
  font-weight:600;
  color:var(--ink);
  transition:background 120ms ease-out, color 120ms ease-out;
}
.btn:hover{ background:var(--paper-sunk); }
.btn-primary{
  background:var(--accent, var(--signal));
  border-color:var(--accent, var(--signal));
  color:var(--paper);
}
.btn-primary:hover{ background:var(--accent-lift, var(--signal-lift)); border-color:var(--accent-lift, var(--signal-lift)); }
.btn-sm{ padding:4px var(--s3); font-size:var(--t-xs); }

table{ width:100%; border-collapse:collapse; font-size:var(--t-sm); }
th,td{ text-align:left; padding:var(--s2) var(--s3); border-bottom:1px solid var(--rule); }
thead th{ font-size:var(--t-xs); color:var(--ink-2); font-weight:600; text-transform:none; border-bottom:1px solid var(--rule-strong); }
tbody tr:nth-child(even){ background:var(--paper-sunk); }
.table-wrap{ overflow-x:auto; }

.prose{
  font-family:var(--font-read);
  font-size:var(--t-base);
  line-height:1.6;
  max-width:68ch;
  color:var(--ink);
}

.hint{ font-size:var(--t-xs); color:var(--ink-2); }
.err{ font-size:var(--t-xs); color:var(--crimson); font-weight:500; }
.badge{
  display:inline-flex; align-items:center;
  font-size:var(--t-xs); font-weight:600;
  padding:2px 8px; border-radius:100px;
  background:var(--signal-wash); color:var(--signal);
}

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s4); }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s4); }
@media (max-width:800px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

.empty-state{
  padding:var(--s6);
  text-align:center;
  color:var(--ink-2);
  font-size:var(--t-sm);
}

/* ============================= COMMAND PALETTE ============================= */
.palette-overlay{
  position:fixed; inset:0;
  background:rgba(16,20,22,.35);
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding-top:12vh;
  z-index:100;
}
.palette-overlay[data-open="true"]{ display:flex; }
.palette{
  width:min(600px, 92vw);
  background:var(--paper);
  border:1px solid var(--rule-strong);
  box-shadow:var(--shadow-card);
  max-height:60vh;
  display:flex;
  flex-direction:column;
}
.palette-input{
  padding:var(--s4);
  border-bottom:1px solid var(--rule);
  display:flex;
  gap:var(--s2);
  align-items:center;
}
.palette-input input{ flex:1; border:none; background:none; font-size:var(--t-md); }
.palette-results{ overflow-y:auto; padding:var(--s2) 0; }
.palette-group-label{ font-size:var(--t-xs); color:var(--ink-3); padding:var(--s2) var(--s4) 4px; font-weight:600; }
.palette-item{
  display:flex; align-items:center; gap:var(--s3);
  padding:var(--s2) var(--s4);
  border-left:3px solid var(--item-accent, transparent);
  cursor:pointer;
}
.palette-item:hover, .palette-item[data-active="true"]{ background:var(--paper-sunk); }
.palette-item-label{ font-weight:500; font-size:var(--t-sm); }
.palette-item-meta{ font-size:var(--t-xs); color:var(--ink-3); margin-left:auto; }

/* ============================= MODAL / SHORTCUT SHEET ============================= */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(16,20,22,.35);
  display:none;
  align-items:center; justify-content:center;
  z-index:100;
  padding:var(--s4);
}
.modal-overlay[data-open="true"]{ display:flex; }
.modal{
  width:min(520px,92vw);
  max-height:80vh;
  overflow-y:auto;
  background:var(--paper);
  border:1px solid var(--rule-strong);
  box-shadow:var(--shadow-card);
  padding:var(--s5);
}
.modal h2{ font-size:var(--t-md); font-weight:600; margin-bottom:var(--s4); }
.kbd-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--rule); font-size:var(--t-sm); }
.kbd-row kbd{ font-family:var(--font-ui); background:var(--paper-sunk); border:1px solid var(--rule); border-radius:4px; padding:1px 6px; }

/* ============================= PRINT ============================= */
@page{ size: A4 landscape; margin: 12mm; }
@media print{
  .bar, .rail, .panel-tools, .palette-overlay, .modal-overlay, .no-print{ display:none !important; }
  #desk{ background-image:none; overflow:visible; height:auto; }
  .app{ display:block; height:auto; }
  .desk-inner{ max-width:none; padding:0; }
  .panel{ display:none !important; }
  .panel[data-printing="true"]{ display:block !important; }
  body{ background:#fff; color:#000; }
}

/* ============================================================ PERIODIC TABLE ============================================================ */
.pt-controls-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:var(--s4); flex-wrap:wrap; margin-bottom:var(--s4); }
.pt-controls-row input[type="range"]{ width:100%; accent-color:var(--signal); }
.pt-grid-wrap{ overflow-x:auto; padding-bottom:var(--s3); }
.periodic-grid{
  display:grid;
  grid-template-columns:repeat(18, minmax(48px, 1fr));
  grid-auto-rows:minmax(48px, 1fr);
  gap:3px;
  min-width:1000px;
}
.element-tile{
  position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:1px solid var(--cat-unknown-edge);
  border-radius:var(--radius-tile);
  padding:2px;
  min-width:0;
  transition:opacity 120ms ease-out, transform 120ms ease-out;
  color:var(--ink);
}
.element-tile:hover{ transform:translateY(-1px); box-shadow:0 2px 6px rgba(22,35,46,.18); z-index:2; }
.et-num{ position:absolute; top:2px; left:3px; font-size:9px; color:var(--ink-2); }
.et-sym{ font-weight:600; font-size:var(--t-sm); line-height:1; }
.et-name{ font-size:8px; color:var(--ink-2); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.et-mass{ font-size:8px; color:var(--ink-3); }
@media (max-width:900px){ .et-name{ display:none; } }
@media (max-width:700px){ .et-mass{ display:none; } }

.element-detail{ display:none; }
.element-detail[data-open="true"]{
  display:block;
  position:fixed;
  top:50%; left:50%; transform:translate(-50%,-50%);
  width:min(480px, 92vw);
  max-height:82vh;
  overflow-y:auto;
  z-index:60;
  box-shadow:var(--shadow-card);
  border:1px solid var(--rule-strong);
}
.detail-inner{ position:relative; padding:var(--s5); }
.detail-top{ display:flex; gap:var(--s4); align-items:center; margin-bottom:var(--s4); }
.detail-symbol{
  font-size:var(--t-2xl); font-weight:700; line-height:1;
  width:88px; height:88px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--paper); border:2px solid; border-radius:var(--radius-tile);
}
.detail-top h2{ font-size:var(--t-md); font-weight:600; }
.detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s3) var(--s4); margin-bottom:var(--s4); }
.detail-grid dt{ font-size:var(--t-xs); color:var(--ink-2); }
.detail-grid dd{ font-size:var(--t-sm); font-weight:500; }
.detail-shell{ display:flex; justify-content:center; margin-bottom:var(--s3); }

/* ============================================================ CHEMISTRY ============================================================ */
.sol-grid td{ text-align:center; font-size:var(--t-xs); cursor:default; }
.sol-grid th{ font-size:var(--t-xs); }
.sol-sol{ background:color-mix(in oklab, var(--barium) 18%, var(--paper)); }
.sol-insol{ background:color-mix(in oklab, var(--crimson) 16%, var(--paper)); }
.sol-slight{ background:color-mix(in oklab, var(--amber) 18%, var(--paper)); }

/* ============================================================ MATHS ============================================================ */
.uc-wrap{ display:flex; gap:var(--s5); flex-wrap:wrap; align-items:flex-start; }
#ucSvg{ flex-shrink:0; background:var(--paper-sunk); border:1px solid var(--rule); }
#ucHandle{ touch-action:none; }

/* animations */
@media (prefers-reduced-motion:no-preference){
  .element-tile{ animation: tile-in 220ms ease-out backwards; }
  @keyframes tile-in{ from{ opacity:0; transform:translateY(2px); } to{ opacity:1; transform:none; } }
  .card-pop{ animation: card-in 160ms ease-out; }
  @keyframes card-in{ from{ opacity:0; transform:scale(.98); } to{ opacity:1; transform:none; } }
}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="bar-brand">The Data Desk</div>
    <div class="bar-search" id="openPaletteBtn" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="paletteTrigger" placeholder="Search anything — press /" readonly>
      <kbd>/</kbd>
    </div>
    <div class="bar-actions">
      <button class="icon-btn no-print" id="shortcutBtn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11h.01M11 11h.01M15 11h.01M17 11h.01M7 15h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn no-print" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" id="themeIcon"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

const AUFBAU_ORDER = ["1s","2s","2p","3s","3p","4s","3d","4p","5s","4d","5p","6s","4f","5d","6p","7s","5f","6d","7p"];

  96:"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p6 5f7 6d1 7s2",
  103:"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p6 5f14 7s2 7p1"
};
const L_ORDER = { s:0, p:1, d:2, f:3 };
function configDisplayOrder(str){
  const parts = str.split(" ").map(p=>{
    const n = parseInt(p,10);
    const l = p.match(/[a-z]/)[0];
    return { n, l, str:p };
  });
  parts.sort((a,b)=> a.n-b.n || L_ORDER[a.l]-L_ORDER[b.l]);
  return parts.map(p=>p.str).join(" ");
}
function buildElectronConfig(Z){
  if (CONFIG_EXCEPTIONS[Z]) return configDisplayOrder(CONFIG_EXCEPTIONS[Z]);
  let remaining = Z;
  const parts = [];
  for (const sub of AUFBAU_ORDER){
    const l = sub[sub.length-1];
    const take = Math.min(SUB_CAP[l], remaining);
    if (take > 0) parts.push(sub+take);
    remaining -= take;
    if (remaining <= 0) break;
  }
  return configDisplayOrder(parts.join(" "));
}
const NOBLE_Z = [2,10,18,36,54,86,118];
const NOBLE_SYM = {2:"He",10:"Ne",18:"Ar",36:"Kr",54:"Xe",86:"Rn",118:"Og"};
function toNobleShorthand(Z, fullConfig){
  let coreZ = 0;
  for (const n of NOBLE_Z){ if (n < Z) coreZ = n; else break; }
  if (coreZ === 0) return fullConfig;
  const coreParts = new Set(buildElectronConfig(coreZ).split(" "));
  const remaining = fullConfig.split(" ").filter(p => !coreParts.has(p));
  return "["+NOBLE_SYM[coreZ]+"] "+remaining.join(" ");
}
function toShellCounts(fullConfig){
  const shells = {};
  for (const part of fullConfig.split(" ")){
    const n = parseInt(part[0],10);
    const count = parseInt(part.slice(2),10);
    shells[n] = (shells[n]||0) + count;
  }
  const maxN = Math.max(...Object.keys(shells).map(Number));
  const arr = [];
  for (let n=1; n<=maxN; n++) arr.push(shells[n]||0);
  return arr;
}

/* ============================================================
   STORE — localStorage wrapper, versioned schema
   ============================================================ */
const SCHEMA_VERSION = 1;
const store = {
  _ok: (() => { try { const k="dd:__test__"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; } catch(e){ return false; } })(),
  get(key, fallback){
    if (!this._ok) return fallback;
    try {
      const raw = localStorage.getItem("dd:"+key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch(e){ return fallback; }
  },
  set(key, value){
    if (!this._ok) return;
    try { localStorage.setItem("dd:"+key, JSON.stringify(value)); } catch(e){}
  },
  init(){
    const v = this.get("v", null);
    if (v === null) {
      this.set("v", SCHEMA_VERSION);
      this.set("theme", "system");
      this.set("recent", []);
      this.set("pinned", []);
      this.set("notes", "");
    }
    // future schema migrations go here, keyed on stored version number
  },
  pushRecent(item){
    const recent = this.get("recent", []).filter(r => r.route !== item.route);
    recent.unshift({ ...item, at: Date.now() });
    this.set("recent", recent.slice(0, 12));
  }
};
store.init();

const themeCtl = {
  apply(mode){
    const root = document.documentElement;
    if (mode === "light" || mode === "dark") root.setAttribute("data-theme", mode);
    else root.removeAttribute("data-theme");
    store.set("theme", mode);
    this.updateIcon(mode);
  },
  current(){ return store.get("theme", "system"); },
  toggle(){
    const order = ["system","light","dark"];
    const next = order[(order.indexOf(this.current())+1) % order.length];
    this.apply(next);
  },
  updateIcon(mode){
    const icon = document.getElementById("themeIcon");
    if (!icon) return;
    icon.innerHTML = mode === "dark"
      ? '<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>'
      : '<circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
  }
};

/* ============================================================
   ROUTER — hash based, "#tab/sub/detail"
   ============================================================ */
const router = {
  listeners: [],
  on(fn){ this.listeners.push(fn); },
  parse(hash){
    const clean = (hash || "").replace(/^#/, "");
    const [tab, ...rest] = clean.split("/");
    return { tab: tab || null, rest, full: clean };
  },
  go(route){ window.location.hash = route.startsWith("#") ? route : "#"+route; },
  current(){ return this.parse(window.location.hash); },
  fire(){ const r = this.current(); this.listeners.forEach(fn => fn(r)); }
};
window.addEventListener("hashchange", () => router.fire());

  const tab = TABS.find(t => t.id === tabId) || TABS[0];

  document.querySelectorAll(".panel").forEach(p => {

  });
  if (!tab._initDone) { tab.init(); tab._initDone = true; }
  if (tab.onRoute) tab.onRoute(rest);
  store.set("lastTab", "#"+tab.id+(rest && rest.length ? "/"+rest.join("/") : ""));

const palette = {
  overlay: null, input: null, results: null, activeIndex: 0, items: [],
  init(){
    this.overlay = document.getElementById("paletteOverlay");
    this.input = document.getElementById("paletteInput");
    this.results = document.getElementById("paletteResults");
    document.getElementById("openPaletteBtn").addEventListener("click", () => this.open());
    this.overlay.addEventListener("click", (e) => { if (e.target === this.overlay) this.close(); });
    this.input.addEventListener("input", () => this.filter());
    this.input.addEventListener("keydown", (e) => this.onKey(e));
  },
  open(){
    this.overlay.dataset.open = "true";
    this.input.value = "";
    this.filter();
    setTimeout(() => this.input.focus(), 0);
  },
  close(){ this.overlay.dataset.open = "false"; },
  isOpen(){ return this.overlay.dataset.open === "true"; },
  filter(){
    const q = this.input.value.trim().toLowerCase();
    let list;
    if (!q) {
      const recent = store.get("recent", []);
      list = recent.map(r => ({ label:r.label, keywords:"", tab:r.tab, route:r.route, group:"Recent", accent:r.accent||"--signal" }));
      if (!list.length) list = SEARCH_INDEX.slice(0, 8);
    } else {
      list = SEARCH_INDEX.filter(e => e.keywords.includes(q) || e.label.toLowerCase().includes(q))
        .sort((a,b) => a.keywords.indexOf(q) - b.keywords.indexOf(q))
        .slice(0, 40);
    }
    this.items = list;
    this.activeIndex = 0;
    this.renderResults();
  },
  renderResults(){
    if (!this.items.length){
      this.results.innerHTML = `<div class="empty-state">No matches. Try an element symbol, a formula, or a tool name.</div>`;
      return;
    }
    let lastGroup = null;
    let html = "";
    this.items.forEach((item, i) => {
      if (item.group !== lastGroup){
        html += `<div class="palette-group-label">${item.group}</div>`;
        lastGroup = item.group;
      }
      html += `<div class="palette-item" data-idx="${i}" style="--item-accent:var(${item.accent})" aria-selected="${i===this.activeIndex}">
        <span class="palette-item-label">${item.label}</span>
        <span class="palette-item-meta">${item.tab}</span>
      </div>`;
    });
    this.results.innerHTML = html;
    this.results.querySelectorAll(".palette-item").forEach(el => {
      el.addEventListener("click", () => this.select(parseInt(el.dataset.idx,10)));
    });
    this.highlight();
  },
  highlight(){
    this.results.querySelectorAll(".palette-item").forEach((el,i) => {
      el.dataset.active = (i === this.activeIndex) ? "true" : "false";
    });
    const activeEl = this.results.querySelector(`[data-idx="${this.activeIndex}"]`);
    if (activeEl) activeEl.scrollIntoView({ block:"nearest" });
  },
  select(i){
    const item = this.items[i];
    if (!item) return;
    store.pushRecent({ label:item.label, tab:item.tab, route:item.route, accent:item.accent });
    router.go(item.route);
    this.close();
  },
  onKey(e){
    if (e.key === "ArrowDown"){ e.preventDefault(); this.activeIndex = Math.min(this.activeIndex+1, this.items.length-1); this.highlight(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); this.activeIndex = Math.max(this.activeIndex-1, 0); this.highlight(); }
    else if (e.key === "Enter"){ e.preventDefault(); this.select(this.activeIndex); }
    else if (e.key === "Escape"){ e.preventDefault(); this.close(); }
  }
};

function isTypingTarget(el){

}
const shortcutModal = {

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape"){
    if (palette.isOpen()) return palette.close();
    if (shortcutModal.isOpen()) return shortcutModal.close();
    const active = TABS.find(t => t._initDone) ;
    document.dispatchEvent(new CustomEvent("dd:escape"));
    return;
  }
  if (palette.isOpen() || isTypingTarget(e.target)) return;
  if (e.key === "/" ){ e.preventDefault(); palette.open(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); palette.open(); return; }
  if (e.key === "?"){ e.preventDefault(); shortcutModal.open(); return; }
  if (e.key === "t" || e.key === "T"){ e.preventDefault(); themeCtl.toggle(); return; }
  if (/^[1-4]$/.test(e.key)){
    const tab = TABS[parseInt(e.key,10)-1];
    if (tab) router.go("#"+tab.id);
  }
});
document.getElementById("themeBtn").addEventListener("click", () => themeCtl.toggle());

/* ============================================================

   ============================================================ */
(function(){
  const CATEGORY_LABEL = {
    alkali:"Alkali metal", alkaline:"Alkaline earth metal", transition:"Transition metal",
    "post-transition":"Post-transition metal", metalloid:"Metalloid", nonmetal:"Nonmetal",
    halogen:"Halogen", noble:"Noble gas", lanthanide:"Lanthanide", actinide:"Actinide", unknown:"Unknown"
  };
  function getBlock(cat, group, period){
    if (cat === "lanthanide" || cat === "actinide") return "f";
    if (group === 1 || group === 2) return "s";
    if (period === 1 && group === 18) return "s"; // helium
    if (group >= 13 && group <= 18) return "p";
    return "d";
  }
  const TREND_FIELDS = {
    radius: { label:"Atomic radius (pm)", get:e=>e.ext.radius, fmt:v=>v+" pm" },
    en:     { label:"Electronegativity (Pauling)", get:e=>e.ext.en, fmt:v=>v.toFixed(2) },
    ie1:    { label:"First ionisation energy (kJ/mol)", get:e=>e.ext.ie1, fmt:v=>v.toFixed(0)+" kJ/mol" },
    mp:     { label:"Melting point (K)", get:e=>e.ext.mp, fmt:v=>v+" K" },
    discovered: { label:"Discovery year", get:e=>e.ext.discovered, fmt:v=> v<0 ? Math.abs(v)+" BCE" : v }
  };

  let els = [];
  let selected = null; // {Z}
  let gridEl, detailCard;

  function buildElements(){
    els = ELEMENTS.map(([Z,sym,name,mass,category,group,period]) => {
      const ext = EXT[sym] || {};
      const cfg = buildElectronConfig(Z);
      return {
        Z, sym, name, mass, category, group, period,
        block: getBlock(category, group, period),
        config: cfg, shorthand: toNobleShorthand(Z, cfg), shells: toShellCounts(cfg),
        ext
      };
    });
  }

  function tileEl(e){
    const btn = document.createElement("button");
    btn.className = "element-tile cat-tile";
    btn.type = "button";
    btn.tabIndex = 0;
    btn.dataset.z = e.Z;
    btn.dataset.group = e.group || "";
    btn.dataset.period = e.period;
    btn.setAttribute("aria-label", `${e.name}, atomic number ${e.Z}`);
    btn.style.gridColumn = e.group ? e.group : (3 + (e.category==="lanthanide" ? e.Z-58 : e.Z-90));
    btn.style.gridRow = e.group ? e.period : (e.category==="lanthanide" ? 9 : 10);
    btn.style.animationDelay = (e.Z * 2) + "ms";
    btn.style.background = `color-mix(in oklab, var(--cat-${e.category}) var(--cat-fill-mix, 100%), var(--paper))`;
    btn.style.borderColor = `var(--cat-${e.category}-edge)`;
    btn.innerHTML = `
      <span class="et-num tabular">${e.Z}</span>
      <span class="et-sym">${e.sym}</span>
      <span class="et-name">${e.name}</span>
      <span class="et-mass tabular">${typeof e.mass === "string" ? e.mass : e.mass.toFixed(3)}</span>
    `;
    btn.addEventListener("click", () => router.go(`#periodic/${e.sym}`));
    btn.addEventListener("keydown", (ev) => handleTileKey(ev, e));
    return btn;
  }

  function handleTileKey(ev, e){
    const deltas = { ArrowRight:[1,0], ArrowLeft:[-1,0], ArrowDown:[0,1], ArrowUp:[0,-1] };
    if (ev.key === "Enter"){ ev.preventDefault(); router.go(`#periodic/${e.sym}`); return; }
    const d = deltas[ev.key];
    if (!d) return;
    ev.preventDefault();
    let g = (e.group || (3 + (e.category==="lanthanide"?e.Z-58:e.Z-90))) + d[0];
    let p = (e.group ? e.period : (e.category==="lanthanide"?9:10)) + d[1];
    const target = Array.from(gridEl.children).find(t => parseInt(t.style.gridColumn,10)===g && parseInt(t.style.gridRow,10)===p);
    if (target) target.focus();
  }

  function renderGrid(){
    gridEl.innerHTML = "";
    els.forEach(e => gridEl.appendChild(tileEl(e)));
    applyColourMode();
  }

  function applySearch(q){
    const query = q.trim().toLowerCase();
    gridEl.querySelectorAll(".element-tile").forEach(t => {
      const e = els.find(x => x.Z === parseInt(t.dataset.z,10));
      const match = !query || e.name.toLowerCase().includes(query) || e.sym.toLowerCase().includes(query) || String(e.Z) === query;
      t.style.opacity = match ? "1" : "0.15";
    });
  }

  let colourMode = "category", trendMode = "none";
  function applyColourMode(){
    const trendActive = trendMode !== "none";
    gridEl.querySelectorAll(".element-tile").forEach(t => {
      const e = els.find(x => x.Z === parseInt(t.dataset.z,10));
      if (trendActive){
        const field = TREND_FIELDS[trendMode];
        const val = field.get(e);
        if (val === null || val === undefined || Number.isNaN(val)){
          t.style.background = "var(--paper-sunk)"; t.style.borderColor = "var(--rule)"; t.title = "No data";
        } else {
          const { min, max } = trendRange(trendMode);
          const frac = max === min ? 0.5 : (val - min) / (max - min);
          t.style.background = `color-mix(in oklab, var(--strontium) ${Math.round(frac*100)}%, var(--barium) ${Math.round((1-frac)*100)}%)`;
          t.style.borderColor = "var(--rule-strong)";
          t.title = `${field.label}: ${field.fmt(val)}`;
        }
        return;
      }
      t.title = "";
      if (colourMode === "category"){
        t.style.background = `color-mix(in oklab, var(--cat-${e.category}) var(--cat-fill-mix, 100%), var(--paper))`; t.style.borderColor = `var(--cat-${e.category}-edge)`;
      } else if (colourMode === "state"){
        const phase = e.ext.phase || "unknown";
        const map = { solid:"--rule-strong", liquid:"--signal", gas:"--lilac", unknown:"--rule" };
        t.style.background = "var(--paper-sunk)"; t.style.borderColor = `var(${map[phase]||"--rule"})`;
      } else if (colourMode === "block"){
        const map = { s:"--crimson", p:"--signal", d:"--amber", f:"--lilac" };
        t.style.background = "var(--paper-sunk)"; t.style.borderColor = `var(${map[e.block]})`;
      } else if (colourMode === "metal"){
        const metal = !["nonmetal","halogen","noble","metalloid"].includes(e.category);
        const map = metal ? "--rule-strong" : (e.category==="metalloid" ? "--lilac" : "--signal");

/* ============================================================
   TAB: Chemistry
   ============================================================ */
(function(){
  const ATOMIC_MASS = {};
  ELEMENTS.forEach(([Z,sym,name,mass]) => { ATOMIC_MASS[sym] = typeof mass === "string" ? parseFloat(mass.replace(/[[\]]/g,"")) : mass; });

  /* ---- formula parsing (handles nested brackets + hydrate dots) ---- */
  function parseFormula(formula){
    let segments = [], depth = 0, buf = "";
    for (let i=0;i<formula.length;i++){
      const c = formula[i];
      if (c === "(" || c === "[") depth++;
      if (c === ")" || c === "]") depth--;
      if (c === "." && depth === 0){ segments.push(buf); buf=""; } else buf += c;
    }
    segments.push(buf);
    const counts = {};
    function parseGroup(s, start, end, local){
      let i = start;
      while (i < end){
        const c = s[i];
        if (c === "(" || c === "["){
          const open=c, close = open==="(" ? ")" : "]";
          let depth=1, j=i+1;
          while (j<end && depth>0){ if (s[j]===open) depth++; if (s[j]===close) depth--; j++; }
          const innerEnd = j-1;
          let k=j, numStr="";
          while (k<end && /\d/.test(s[k])){ numStr+=s[k]; k++; }
          const groupMult = numStr ? parseInt(numStr,10) : 1;
          const inner = {};
          parseGroup(s, i+1, innerEnd, inner);
          for (const el in inner) local[el] = (local[el]||0) + inner[el]*groupMult;
          i = k;
        } else if (/[A-Z]/.test(c)){
          let j=i+1;
          while (j<end && /[a-z]/.test(s[j])) j++;
          const el = s.slice(i,j);
          let numStr="";
          while (j<end && /\d/.test(s[j])){ numStr+=s[j]; j++; }
          const n = numStr ? parseInt(numStr,10) : 1;
          local[el] = (local[el]||0) + n;
          i = j;
        } else i++;
      }
    }
    function parseSegment(seg){
      let m = seg.match(/^(\d+)(.*)$/);
      let mult = 1;
      if (m){ mult = parseInt(m[1],10); seg = m[2]; }
      const local = {};
      parseGroup(seg, 0, seg.length, local);
      for (const el in local) counts[el] = (counts[el]||0) + local[el]*mult;
    }
    segments.forEach(parseSegment);
    return counts;
  }
  function molarMass(formula){
    const counts = parseFormula(formula);
    let total = 0;
    const breakdown = [];
    const unknown = [];
    for (const el in counts){
      const mass = ATOMIC_MASS[el];
      if (mass === undefined){ unknown.push(el); continue; }
      const subtotal = mass * counts[el];
      breakdown.push({ el, count:counts[el], mass, subtotal });
      total += subtotal;
    }
    return { total, breakdown, counts, unknown };
  }

  /* ---- equation balancer (Gaussian elimination over rationals) ---- */
  function gcdInt(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; }
  function rSimplify([n,d]){ if (d<0){n=-n;d=-d;} const g=gcdInt(n,d); return g?[n/g,d/g]:[0,1]; }
  function rAdd(a,b){ return rSimplify([a[0]*b[1]+b[0]*a[1], a[1]*b[1]]); }
  function rSub(a,b){ return rSimplify([a[0]*b[1]-b[0]*a[1], a[1]*b[1]]); }
  function rMul(a,b){ return rSimplify([a[0]*b[0], a[1]*b[1]]); }
  function rDiv(a,b){ return rSimplify([a[0]*b[1], a[1]*b[0]]); }
  function rIsZero(a){ return a[0]===0; }
  function elementCounts(formula){
    const counts = {};
    function parseGroup(s,start,end,local){
      let i=start;
      while(i<end){
        const c=s[i];
        if (c==="(" || c==="["){
          const open=c, close=open==="("?")":"]";
          let depth=1,j=i+1;
          while(j<end && depth>0){ if(s[j]===open) depth++; if(s[j]===close) depth--; j++; }
          const innerEnd=j-1;
          let k=j,numStr="";
          while(k<end && /\d/.test(s[k])){ numStr+=s[k]; k++; }
          const groupMult = numStr?parseInt(numStr,10):1;
          const inner={};
          parseGroup(s,i+1,innerEnd,inner);
          for (const el in inner) local[el]=(local[el]||0)+inner[el]*groupMult;
          i=k;
        } else if (/[A-Z]/.test(c)){
          let j=i+1;
          while(j<end && /[a-z]/.test(s[j])) j++;
          const el=s.slice(i,j);
          let numStr="";
          while(j<end && /\d/.test(s[j])){ numStr+=s[j]; j++; }
          const n=numStr?parseInt(numStr,10):1;
          local[el]=(local[el]||0)+n;
          i=j;
        } else i++;
      }
    }
    parseGroup(formula,0,formula.length,counts);
    return counts;
  }
  function balanceEquation(eqStr){
    if (!/->|=/.test(eqStr)) return { ok:false, reason:"Use -> to separate reactants and products." };
    const [lhsStr, rhsStr] = eqStr.split(/->|=/).map(s=>s.trim());
    if (!lhsStr || !rhsStr) return { ok:false, reason:"Both sides of the equation are needed." };
    const parseSide = side => side.split("+").map(s=>s.trim()).map(term=>{
      let m = term.match(/^(\d*)(.+)$/);
      return { formula: (m ? m[2] : term).trim() };
    });
    const lhs = parseSide(lhsStr), rhs = parseSide(rhsStr);
    const species = [...lhs.map(t=>t.formula), ...rhs.map(t=>t.formula)];
    const nLhs = lhs.length;
    let speciesCounts;
    try { speciesCounts = species.map(f => elementCounts(f)); }
    catch(e){ return { ok:false, reason:"Could not parse a formula." }; }
    const elements = new Set();
    speciesCounts.forEach(c => Object.keys(c).forEach(e=>elements.add(e)));
    const elList = [...elements];
    let matrix = elList.map(el => speciesCounts.map((c,idx)=> rSimplify([(idx<nLhs?1:-1)*(c[el]||0),1])));
    let rows = matrix.length, cols = species.length, lead = 0;
    for (let r=0; r<rows && lead<cols; r++){
      let i=r;
      while (i<rows && rIsZero(matrix[i][lead])) i++;
      if (i===rows){ lead++; r--; continue; }
      [matrix[i],matrix[r]] = [matrix[r],matrix[i]];
      const lv = matrix[r][lead];
      matrix[r] = matrix[r].map(v=>rDiv(v,lv));
      for (let k=0;k<rows;k++){
        if (k!==r){
          const factor = matrix[k][lead];
          if (!rIsZero(factor)) matrix[k] = matrix[k].map((v,c2)=>rSub(v, rMul(factor, matrix[r][c2])));
        }
      }
      lead++;
    }
    const freeIdx = cols-1;
    let coeffs = new Array(cols).fill(null);
    coeffs[freeIdx] = [1,1];
    for (let r=rows-1; r>=0; r--){
      let pivotCol=-1;
      for (let c=0;c<cols;c++){ if (!rIsZero(matrix[r][c])){ pivotCol=c; break; } }
      if (pivotCol===-1 || pivotCol===freeIdx) continue;
      let sum=[0,1];
      for (let c=0;c<cols;c++){
        if (c===pivotCol) continue;
        if (coeffs[c]==null) continue;
        sum = rAdd(sum, rMul(matrix[r][c], coeffs[c]));
      }
      coeffs[pivotCol] = rSimplify([-sum[0], sum[1]]);
    }
    if (coeffs.some(c=>c==null)) return { ok:false, reason:"This equation is underdetermined — it needs an extra constraint (e.g. a known product ratio) to balance uniquely." };
    let denom=1;
    for (const c of coeffs) denom = (denom*c[1])/gcdInt(denom,c[1]);
    let ints = coeffs.map(c => Math.round(c[0]*(denom/c[1])));
    let g = ints.reduce((a,b)=>gcdInt(a,b),0);
    ints = ints.map(v=>v/g);
    if (ints.some(v=>v<=0)) return { ok:false, reason:"No balanced equation exists with positive whole-number coefficients — check the formulas." };
    return { ok:true, coeffs:ints, species, nLhs };
  }

  /* ---- UI ---- */
  const SECTIONS = [
    { id:"molar", label:"Molar calculator" },
    { id:"balance", label:"Equation balancer" },
    { id:"solubility", label:"Solubility" },
    { id:"reference", label:"Reference" },
    { id:"organic", label:"Organic" },
    { id:"titration", label:"Titration" }
  ];
  let activeSection = "molar";

  function renderSegmented(){
    return `<div class="segmented" id="chemSeg">${SECTIONS.map(s=>`<button data-id="${s.id}" aria-selected="${s.id===activeSection}">${s.label}</button>`).join("")}</div>`;
  }

  function renderMolar(){
    return `
      <div class="sheet">
        <div class="sheet-head">Molar mass calculator</div>
        <div class="sheet-body">
          <div class="field" style="max-width:360px;">
            <label for="molarFormula">Formula (nested brackets and hydrates OK)</label>
            <input type="text" id="molarFormula" placeholder="e.g. CuSO4.5H2O" value="Ca(OH)2">
          </div>
          <div id="molarOut" style="margin-top:var(--s4);"></div>
        </div>
      </div>
      <div class="sheet">
        <div class="sheet-head">Mass ⇄ moles ⇄ particles</div>
        <div class="sheet-body">
          <p class="hint" style="margin-bottom:var(--s3);">Fill in any one field — the others fill themselves in using the molar mass above.</p>
          <div class="grid-3">
            <div class="field"><label>Mass (g)</label><input type="number" id="convMass"></div>
            <div class="field"><label>Moles (mol)</label><input type="number" id="convMol"></div>
            <div class="field"><label>Particles</label><input type="number" id="convPart"></div>
          </div>
        </div>
      </div>
    `;
  }
  function wireMolar(){
    const input = document.getElementById("molarFormula");
    const out = document.getElementById("molarOut");
    const massEl = document.getElementById("convMass"), molEl = document.getElementById("convMol"), partEl = document.getElementById("convPart");
    let currentMM = null;
    function update(){
      const f = input.value.trim();
      if (!f){ out.innerHTML = ""; return; }
      let result;
      try { result = molarMass(f); } catch(e){ out.innerHTML = `<p class="err">Could not parse that formula.</p>`; return; }
      if (result.unknown.length){ out.innerHTML = `<p class="err">Unknown element symbol: ${result.unknown.join(", ")}</p>`; return; }
      currentMM = result.total;
      out.innerHTML = `
        <div class="table-wrap"><table><thead><tr><th>Element</th><th>Count</th><th>Atomic mass</th><th>Subtotal</th></tr></thead><tbody>
          ${result.breakdown.map(b=>`<tr><td>${b.el}</td><td class="tabular">${b.count}</td><td class="tabular">${b.mass}</td><td class="tabular">${b.subtotal.toFixed(3)}</td></tr>`).join("")}
        </tbody></table></div>
        <p style="margin-top:var(--s3);font-weight:600;">Molar mass = <span class="tabular">${result.total.toFixed(2)}</span> g/mol</p>
      `;

    }
    function syncFromMass(){ if (currentMM && massEl.value) { molEl.value = (parseFloat(massEl.value)/currentMM).toFixed(4); partEl.value = (parseFloat(molEl.value)*6.022e23).toExponential(4); } }

    molEl.addEventListener("input", () => { const mol = parseFloat(molEl.value); if (currentMM) massEl.value = isFinite(mol)?(mol*currentMM).toFixed(4):""; partEl.value = isFinite(mol)?(mol*6.022e23).toExponential(4):""; });
    partEl.addEventListener("input", () => { const part = parseFloat(partEl.value); const mol = part/6.022e23; molEl.value = isFinite(mol)?mol.toFixed(4):""; if (currentMM) massEl.value = isFinite(mol)?(mol*currentMM).toFixed(4):""; });
    update();
  }

  function renderBalance(){
    return `
      <div class="sheet">
        <div class="sheet-head">Equation balancer</div>

          <div class="field">

  }
  function wireBalance(){

      const result = balanceEquation(eq);

      const { coeffs, species, nLhs } = result;
      const side = (from,to) => species.slice(from,to).map((f,i)=>{

      }).join(" + ");

  }

  function renderSolubility(){
    const cations = ["Na⁺/K⁺/NH₄⁺","Ag⁺","Pb²⁺","Ca²⁺","Ba²⁺","Cu²⁺","Fe³⁺"];
    const anions = ["Cl⁻","Br⁻","I⁻","SO₄²⁻","CO₃²⁻","OH⁻","NO₃⁻"];
    function verdict(cat, an){

      if (an === "Cl⁻" || an==="Br⁻" || an==="I⁻"){
        if (cat==="Ag⁺") return ["insoluble", an==="Cl⁻"?"white":an==="Br⁻"?"cream":"yellow"];
        if (cat==="Pb²⁺") return ["insoluble", an==="I⁻"?"bright yellow":"white"];
        return ["soluble",""];
      }
      if (an === "SO₄²⁻"){
        if (cat==="Ba²⁺") return ["insoluble","white"];
        if (cat==="Pb²⁺") return ["insoluble","white"];
        if (cat==="Ca²⁺") return ["slightly soluble",""];
        return ["soluble",""];
      }
      if (an === "CO₃²⁻" || an === "OH⁻"){
        if (cat==="Ca²⁺" || cat==="Ba²⁺") return an==="OH⁻" ? ["slightly soluble",""] : ["insoluble","white"];
        if (cat==="Cu²⁺") return [an==="OH⁻"?"insoluble":"insoluble", an==="OH⁻"?"pale blue":"green-blue"];
        if (cat==="Fe³⁺") return [an==="OH⁻"?"insoluble":"insoluble", an==="OH⁻"?"rust brown":"—"];
        return ["insoluble",""];
      }
      return ["—",""];
    }
    let rows = `<tr><th></th>${anions.map(a=>`<th>${a}</th>`).join("")}</tr>`;
    cations.forEach(cat => {
      rows += `<tr><th>${cat}</th>${anions.map(an=>{
        const [v,colour] = verdict(cat,an);
        const cls = v==="insoluble" ? "sol-insol" : v==="soluble" ? "sol-sol" : "sol-slight";
        return `<td class="${cls}" title="${colour}">${v}${colour?` · ${colour}`:""}</td>`;
      }).join("")}</tr>`;
    });
    return `
      <div class="sheet">
        <div class="sheet-head">Solubility grid — click a cell's row/column combo to check</div>

  function wireSolver(){
    const pick = document.getElementById("solverPick");
    const fields = document.getElementById("solverFields");

    function build(){
      const f = FORMULAS.find(x=>x.id===pick.value);
      fields.innerHTML = `<div class="grid-3">${f.vars.map(([key,label,unit])=>`
        <div class="field"><label>${label} (${unit})</label><input type="number" step="any" data-key="${key}" value="${f.defaults&&f.defaults[key]!=null?f.defaults[key]:""}"></div>

    function compute(f){
      const inputs = Array.from(fields.querySelectorAll("input"));
      const blanks = inputs.filter(i => i.value.trim()==="");
      if (blanks.length !== 1){ out.innerHTML = `<p class="hint">${blanks.length===0?"All fields filled — clear one to solve for it.":"Leave exactly one field blank."}</p>`; return; }
      const missing = blanks[0].dataset.key;
      const known = {};
      inputs.forEach(i => { if (i.dataset.key !== missing) known[i.dataset.key] = parseFloat(i.value); });
      const result = f.solve(known, missing);
      if (!isFinite(result)){ out.innerHTML = `<p class="err">No real solution for these values.</p>`; return; }

    build();
  }

(function(){

        else if (word==="pi") tokens.push({type:"num",value:Math.PI});
        else if (word==="e") tokens.push({type:"num",value:Math.E});

      const opensValue = next.type==="num"||next.type==="var"||next.type==="func"||(next.type==="op"&&next.value==="(");
      if (closesValue && opensValue) out.push({type:"op",value:"*"});

  /* ---- graphing tool ---- */
  const GRAPH_COLOURS = ["--signal","--crimson","--lilac"];
  let graphView = { xMin:-10, xMax:10, yMin:-10, yMax:10 };
  function renderGraph(){

  function wireGraph(){
    const canvas = document.getElementById("gCanvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const inputs = [document.getElementById("gf1"), document.getElementById("gf2"), document.getElementById("gf3")];
    const info = document.getElementById("gInfo");
    const winLabel = document.getElementById("gWindow");

    function toPx(x,y){ const { xMin,xMax,yMin,yMax } = graphView; return [ (x-xMin)/(xMax-xMin)*W, H - (y-yMin)/(yMax-yMin)*H ]; }
    function toX(px){ const { xMin,xMax } = graphView; return xMin + (px/W)*(xMax-xMin); }
    function toY(py){ const { yMin,yMax } = graphView; return yMin + ((H-py)/H)*(yMax-yMin); }

    function draw(){
      ctx.clearRect(0,0,W,H);
      const cssInk2 = getComputedStyle(document.documentElement).getPropertyValue("--rule").trim();
      const cssInk = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
      const cssRuleStrong = getComputedStyle(document.documentElement).getPropertyValue("--rule-strong").trim();
      // grid
      ctx.strokeStyle = cssInk2; ctx.lineWidth = 1;
      const { xMin,xMax,yMin,yMax } = graphView;
      const stepX = niceStep(xMax-xMin), stepY = niceStep(yMax-yMin);
      ctx.beginPath();
      for (let gx = Math.ceil(xMin/stepX)*stepX; gx<=xMax; gx+=stepX){ const [px] = toPx(gx,0); ctx.moveTo(px,0); ctx.lineTo(px,H); }
      for (let gy = Math.ceil(yMin/stepY)*stepY; gy<=yMax; gy+=stepY){ const [,py] = toPx(0,gy); ctx.moveTo(0,py); ctx.lineTo(W,py); }
      ctx.stroke();
      // axes
      ctx.strokeStyle = cssRuleStrong; ctx.lineWidth = 2;
      ctx.beginPath();
      const [pxZero] = toPx(0,0), [,pyZero] = toPx(0,0);
      ctx.moveTo(pxZero,0); ctx.lineTo(pxZero,H); ctx.moveTo(0,pyZero); ctx.lineTo(W,pyZero);
      ctx.stroke();
      // functions
      let anyErr = "";
      const fns = [];
      inputs.forEach((inp, i) => {
        const expr = inp.value.trim();
        inp.style.borderColor = "";
        if (!expr) return;
        let f;
        try { f = compileExpr(expr); } catch(e){ inp.style.borderColor = "var(--crimson)"; return; }
        fns.push({ f, colour: GRAPH_COLOURS[i], expr });
      });
      fns.forEach(({f,colour}) => {
        ctx.strokeStyle = `var(${colour})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        let started = false, lastY = null;
        for (let px=0; px<=W; px++){
          const x = toX(px);
          let y;
          try { y = f(x); } catch(e){ y = NaN; }
          if (!isFinite(y)){ started=false; continue; }
          const [,py] = toPx(x,y);
          if (started && lastY!==null && Math.abs(py-lastY) > H*0.9){ started=false; }
          if (!started){ ctx.moveTo(px,py); started=true; } else ctx.lineTo(px,py);
          lastY = py;
        }
        ctx.stroke();
      });
      winLabel.textContent = `x: [${xMin.toFixed(1)}, ${xMax.toFixed(1)}]  y: [${yMin.toFixed(1)}, ${yMax.toFixed(1)}]`;
      renderInfo(fns);
    }
    function niceStep(range){
      const raw = range/10;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const norm = raw/mag;
      const nice = norm<1.5?1:norm<3.5?2:norm<7.5?5:10;
      return nice*mag;
    }
    function findRoots(f, xMin, xMax){
      const roots = []; const N=2000; let prevX=xMin, prevY, prevSign;
      try { prevY = f(prevX); } catch(e){ prevY=NaN; }
      prevSign = isFinite(prevY) ? Math.sign(prevY) : 0;
      for (let i=1;i<=N;i++){
        const x = xMin + (xMax-xMin)*i/N;
        let y; try { y=f(x); } catch(e){ y=NaN; }
        const sign = isFinite(y) ? Math.sign(y) : 0;
        if (sign===0 && isFinite(y)){ roots.push(x); prevX=x; if (sign!==0){ prevY=y; prevSign=sign; } continue; }
        if (isFinite(prevY) && isFinite(y) && prevSign!==0 && sign!==0 && prevSign!==sign){
          let lo=prevX, hi=x, loSign=prevSign;
          for (let iter=0; iter<40; iter++){ const mid=(lo+hi)/2; let ym; try{ym=f(mid);}catch(e){ym=NaN;} if (!isFinite(ym)) break; (Math.sign(ym)===loSign? lo=mid : hi=mid); }
          roots.push((lo+hi)/2);
        }
        prevX=x;
        if (sign!==0){ prevY=y; prevSign=sign; }
      }
      return roots.sort((a,b)=>a-b).filter((r,i,arr)=> i===0 || Math.abs(r-arr[i-1])>1e-6);
    }
    function findTurningPoints(f, xMin, xMax){
      const N=1000, h=(xMax-xMin)/N/2;
      const pts=[]; let prevD, prevSign;
      try { prevD = (f(xMin+h)-f(xMin-h))/(2*h); } catch(e){ prevD=NaN; }
      prevSign = isFinite(prevD) ? Math.sign(prevD) : 0;
      for (let i=1;i<=N;i++){
        const x = xMin + (xMax-xMin)*i/N;
        let d; try { d=(f(x+h)-f(x-h))/(2*h); } catch(e){ d=NaN; }
        const sign = isFinite(d) ? Math.sign(d) : 0;
        if (isFinite(prevD) && isFinite(d) && prevSign!==0 && sign!==0 && prevSign!==sign){
          let lo=x-(xMax-xMin)/N, hi=x;
          for (let iter=0; iter<30; iter++){ const mid=(lo+hi)/2; let dm; try{dm=(f(mid+h)-f(mid-h))/(2*h);}catch(e){dm=NaN;} if (!isFinite(dm)) break; (Math.sign(dm)===prevSign? lo=mid : hi=mid); }
          const xm=(lo+hi)/2; let ym; try{ym=f(xm);}catch(e){ym=NaN;}
          if (isFinite(ym) && (!pts.length || Math.abs(xm-pts[pts.length-1][0])>1e-4)) pts.push([xm,ym]);
        }
        if (sign!==0){ prevD=d; prevSign=sign; }
      }
      return pts;
    }
    function renderInfo(fns){
      info.innerHTML = fns.map(({f,colour,expr}) => {
        const roots = findRoots(f, graphView.xMin, graphView.xMax);
        const turns = findTurningPoints(f, graphView.xMin, graphView.xMax);
        let y0; try { y0=f(0); } catch(e){ y0=NaN; }
        return `<p style="border-left:3px solid var(${colour});padding-left:var(--s3);margin-bottom:var(--s2);">
          <strong class="tabular">${expr}</strong> —
          y-intercept: <span class="tabular">${isFinite(y0)?y0.toFixed(3):"—"}</span> ·
          x-intercepts: <span class="tabular">${roots.length?roots.map(r=>r.toFixed(3)).join(", "):"none found in view"}</span> ·
          turning points: <span class="tabular">${turns.length?turns.map(([x,y])=>`(${x.toFixed(2)}, ${y.toFixed(2)})`).join(", "):"none found in view"}</span>
        </p>`;
      }).join("");
    }

    let dragging = false, dragStart = null, viewStart = null;
    canvas.addEventListener("pointerdown", (e) => { dragging=true; dragStart={x:e.clientX,y:e.clientY}; viewStart={...graphView}; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = (viewStart.xMax-viewStart.xMin)/rect.width, scaleY=(viewStart.yMax-viewStart.yMin)/rect.height;
      const dx = (e.clientX-dragStart.x)*scaleX, dy=(e.clientY-dragStart.y)*scaleY;
      graphView = { xMin:viewStart.xMin-dx, xMax:viewStart.xMax-dx, yMin:viewStart.yMin+dy, yMax:viewStart.yMax+dy };
      draw();
    });
    canvas.addEventListener("pointerup", () => dragging=false);
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = e.deltaY>0 ? 1.1 : 0.9;
      const { xMin,xMax,yMin,yMax } = graphView;
      const cx = (xMin+xMax)/2, cy=(yMin+yMax)/2;
      const halfX = (xMax-xMin)/2*factor, halfY=(yMax-yMin)/2*factor;
      graphView = { xMin:cx-halfX, xMax:cx+halfX, yMin:cy-halfY, yMax:cy+halfY };
      draw();
    }, { passive:false });
    document.getElementById("gReset").addEventListener("click", () => { graphView = { xMin:-10,xMax:10,yMin:-10,yMax:10 }; draw(); });
    inputs.forEach(inp => inp.addEventListener("input", draw));
    draw();
  }

  function renderSolvers(){

  function wireQuadratic(){
    const a=document.getElementById("qa"), b=document.getElementById("qb"), c=document.getElementById("qc"), out=document.getElementById("qOut");
    function update(){
      const A=parseFloat(a.value), B=parseFloat(b.value), C=parseFloat(c.value);
      if (![A,B,C].every(isFinite) || A===0){ out.innerHTML = `<p class="err">a must be a nonzero number.</p>`; return; }
      const D = B*B-4*A*C;
      if (D<0){ out.innerHTML = `<p>Discriminant = ${D} — no real roots.</p>`; return; }
      const { coeff, rad } = simplifySqrt(D);
      if (rad===1 || rad===0){
        const sq = coeff;
        const r1 = (-B+sq)/(2*A), r2=(-B-sq)/(2*A);
        out.innerHTML = `<p class="hint">Δ = ${D} — rational roots.</p><p style="font-weight:600;">x = ${r1.toFixed(4).replace(/\.?0+$/,"")} or x = ${r2.toFixed(4).replace(/\.?0+$/,"")}</p>`;
        return;
      }
      const g = gcd3(B, coeff, 2*A);
      const Bp=B/g, cp=coeff/g, Ap=2*A/g;
      const sign = Ap<0 ? -1 : 1;
      const surd = surdStr(cp*sign, rad);
      const lead = -Bp*sign;
      out.innerHTML = `
        <p class="hint tabular">x = (−b ± √(b² − 4ac)) / 2a = (${-B} ± √${D}) / ${2*A} = (${-B} ± ${surdStr(coeff,rad)}) / ${2*A}</p>
        <p style="font-weight:600;">x = (${lead} ± ${surd}) / ${Math.abs(Ap)}</p>
      `;
    }
    [a,b,c].forEach(el=>el.addEventListener("input",update)); update();
  }
  function gaussSolve(A, bVec){
    const n = A.length;
    const M = A.map((row,i)=>[...row, bVec[i]]);
    for (let col=0; col<n; col++){
      let piv=col;
      for (let r=col+1;r<n;r++) if (Math.abs(M[r][col])>Math.abs(M[piv][col])) piv=r;
      if (Math.abs(M[piv][col])<1e-12) return null;
      [M[col],M[piv]]=[M[piv],M[col]];
      for (let r=0;r<n;r++){
        if (r===col) continue;
        const factor = M[r][col]/M[col][col];
        for (let c2=col;c2<=n;c2++) M[r][c2]-=factor*M[col][c2];
      }
    }
    return M.map((row,i)=>row[n]/row[i]);
  }
  function wireSimultaneous(){

  function wireTriangle(){
    const caseSel = document.getElementById("triCase"), fields=document.getElementById("triFields"), out=document.getElementById("triOut");
    const d2r = Math.PI/180, r2d = 180/Math.PI;
    function fieldsFor(kase){
      if (kase==="SSS") return [["a","side a"],["b","side b"],["c","side c"]];
      if (kase==="SAS") return [["a","side a"],["C","included angle C (°)"],["b","side b"]];
      if (kase==="ASA") return [["A","angle A (°)"],["c","side c"],["B","angle B (°)"]];
      return [["a","side a"],["b","side b"],["A","angle A (°), opposite side a"]];
    }
    function build(){
      const specs = fieldsFor(caseSel.value);
      fields.innerHTML = `<div class="grid-3">${specs.map(([k,l])=>`<div class="field"><label>${l}</label><input type="number" data-k="${k}" value="1"></div>`).join("")}</div>`;
      fields.querySelectorAll("input").forEach(inp=>inp.addEventListener("input",update));
      update();
    }
    function area(a,b,C){ return 0.5*a*b*Math.sin(C*d2r); }
    function update(){
      const vals = {}; fields.querySelectorAll("input").forEach(inp => vals[inp.dataset.k] = parseFloat(inp.value));
      const kase = caseSel.value;
      try {
        if (kase==="SSS"){
          const {a,b,c} = vals;
          if ([a,b,c].some(v=>!isFinite(v)||v<=0) || a+b<=c || b+c<=a || a+c<=b) throw new Error("Not a valid triangle.");
          const A = Math.acos((b*b+c*c-a*a)/(2*b*c))*r2d;
          const B = Math.acos((a*a+c*c-b*b)/(2*a*c))*r2d;
          const C = 180-A-B;
          out.innerHTML = `<p class="tabular">A = ${A.toFixed(2)}°, B = ${B.toFixed(2)}°, C = ${C.toFixed(2)}°</p><p>Area = <span class="tabular">${area(a,b,C).toFixed(4)}</span></p>`;
        } else if (kase==="SAS"){
          const {a,C,b} = vals;
          if (![a,C,b].every(isFinite) || a<=0||b<=0||C<=0||C>=180) throw new Error("Check your values.");
          const c = Math.sqrt(a*a+b*b-2*a*b*Math.cos(C*d2r));
          const A = Math.asin(a*Math.sin(C*d2r)/c)*r2d;
          const B = 180-C-A;
          out.innerHTML = `<p class="tabular">c = ${c.toFixed(4)}, A = ${A.toFixed(2)}°, B = ${B.toFixed(2)}°</p><p>Area = <span class="tabular">${area(a,b,C).toFixed(4)}</span></p>`;
        } else if (kase==="ASA"){
          const {A,c,B} = vals;
          if (![A,c,B].every(isFinite) || A<=0||B<=0||c<=0||A+B>=180) throw new Error("Check your values.");
          const C = 180-A-B;
          const a = c*Math.sin(A*d2r)/Math.sin(C*d2r);
          const b = c*Math.sin(B*d2r)/Math.sin(C*d2r);
          out.innerHTML = `<p class="tabular">C = ${C.toFixed(2)}°, a = ${a.toFixed(4)}, b = ${b.toFixed(4)}</p><p>Area = <span class="tabular">${area(a,b,C).toFixed(4)}</span></p>`;
        } else {
          const {a,b,A} = vals;
          if (![a,b,A].every(isFinite) || a<=0||b<=0||A<=0||A>=180) throw new Error("Check your values.");
          const sinB = b*Math.sin(A*d2r)/a;
          if (sinB > 1){ out.innerHTML = `<p class="err">No triangle exists with these values.</p>`; return; }
          const B1 = Math.asin(sinB)*r2d;
          const solutions = [B1];
          const B2 = 180-B1;
          if (B2 !== B1 && A+B2 < 180) solutions.push(B2);
          out.innerHTML = `<p class="hint">${solutions.length===2?"Ambiguous case — two possible triangles:":"One triangle:"}</p>` +
            solutions.map(B=>{
              const C = 180-A-B;
              const c = a*Math.sin(C*d2r)/Math.sin(A*d2r);
              return `<p class="tabular">B = ${B.toFixed(2)}°, C = ${C.toFixed(2)}°, c = ${c.toFixed(4)} · Area = ${area(a,b,C).toFixed(4)}</p>`;
            }).join("");
        }
      } catch(e){ out.innerHTML = `<p class="err">${e.message}</p>`; }
    }
    caseSel.addEventListener("change", build);
    build();
  }

  function quartiles(sorted){
    const n = sorted.length;
    const median = n%2 ? sorted[(n-1)/2] : (sorted[n/2-1]+sorted[n/2])/2;
    const lower = n%2 ? sorted.slice(0,(n-1)/2) : sorted.slice(0,n/2);
    const upper = n%2 ? sorted.slice((n+1)/2) : sorted.slice(n/2);
    const med = arr => { const m=arr.length; return m%2 ? arr[(m-1)/2] : (arr[m/2-1]+arr[m/2])/2; };
    return { median, q1: med(lower), q3: med(upper) };
  }
  function wireStats(){
    const dataEl = document.getElementById("statData"), out = document.getElementById("statOut");
    const boxCanvas = document.getElementById("statBox"), histCanvas = document.getElementById("statHist");
    function update(){
      const nums = dataEl.value.split(/[\s,]+/).map(s=>parseFloat(s)).filter(v=>isFinite(v));
      if (nums.length < 2){ out.innerHTML = `<p class="err">Enter at least two numbers.</p>`; return; }
      const sorted = [...nums].sort((a,b)=>a-b);
      const n = nums.length;
      const mean = nums.reduce((a,b)=>a+b,0)/n;
      const modeMap = {}; nums.forEach(v=>modeMap[v]=(modeMap[v]||0)+1);
      const maxFreq = Math.max(...Object.values(modeMap));
      const modes = Object.keys(modeMap).filter(k=>modeMap[k]===maxFreq).map(Number);
      const range = sorted[n-1]-sorted[0];
      const { median, q1, q3 } = quartiles(sorted);
      const iqr = q3-q1;
      const sampleVar = nums.reduce((a,v)=>a+(v-mean)**2,0)/(n-1);
      const popVar = nums.reduce((a,v)=>a+(v-mean)**2,0)/n;
      out.innerHTML = `
        <div class="table-wrap"><table>
          <tr><td>n</td><td class="tabular">${n}</td></tr>
          <tr><td>Mean</td><td class="tabular">${mean.toFixed(4)}</td></tr>
          <tr><td>Median</td><td class="tabular">${median}</td></tr>
          <tr><td>Mode</td><td class="tabular">${modes.length===Object.keys(modeMap).length?"none (all unique)":modes.join(", ")}</td></tr>
          <tr><td>Range</td><td class="tabular">${range}</td></tr>
          <tr><td>Q1 / Q3</td><td class="tabular">${q1} / ${q3}</td></tr>
          <tr><td>IQR</td><td class="tabular">${iqr}</td></tr>
          <tr><td>Sample std dev (n−1)</td><td class="tabular">${Math.sqrt(sampleVar).toFixed(4)}</td></tr>
          <tr><td>Population std dev (n)</td><td class="tabular">${Math.sqrt(popVar).toFixed(4)}</td></tr>
        </table></div>
      `;
      drawBox(boxCanvas, sorted, q1, median, q3);
      drawHist(histCanvas, sorted);
    }
    function drawBox(canvas, sorted, q1, median, q3){
      const ctx = canvas.getContext("2d"); const W=canvas.width, H=canvas.height;
      ctx.clearRect(0,0,W,H);
      const min=sorted[0], max=sorted[sorted.length-1];
      const pad=30;
      const scaleX = v => pad + (v-min)/(max-min || 1)*(W-2*pad);
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
      ctx.lineWidth=1.5;
      const midY = H/2;
      ctx.beginPath(); ctx.moveTo(scaleX(min),midY); ctx.lineTo(scaleX(q1),midY); ctx.moveTo(scaleX(q3),midY); ctx.lineTo(scaleX(max),midY); ctx.stroke();
      ctx.strokeRect(scaleX(q1), midY-18, scaleX(q3)-scaleX(q1), 36);
      ctx.beginPath(); ctx.moveTo(scaleX(median),midY-18); ctx.lineTo(scaleX(median),midY+18); ctx.stroke();
      [min,max].forEach(v=>{ ctx.beginPath(); ctx.moveTo(scaleX(v),midY-10); ctx.lineTo(scaleX(v),midY+10); ctx.stroke(); });
      ctx.fillStyle = ctx.strokeStyle; ctx.font="10px Archivo, sans-serif"; ctx.textAlign="center";
      [["min",min],["Q1",q1],["med",median],["Q3",q3],["max",max]].forEach(([lbl,v])=>ctx.fillText(lbl, scaleX(v), midY+32));
    }
    function drawHist(canvas, sorted){
      const ctx = canvas.getContext("2d"); const W=canvas.width, H=canvas.height;
      ctx.clearRect(0,0,W,H);
      const min=sorted[0], max=sorted[sorted.length-1];
      const bins = Math.max(4, Math.ceil(Math.log2(sorted.length)+1));
      const width = (max-min)/bins || 1;
      const counts = Array(bins).fill(0);
      sorted.forEach(v => { let idx = Math.floor((v-min)/width); if (idx>=bins) idx=bins-1; if(idx<0) idx=0; counts[idx]++; });
      const maxCount = Math.max(...counts);
      const pad=24, plotH = H-2*pad, barW = (W-2*pad)/bins;
      ctx.fillStyle = "rgb(15,110,99)";
      counts.forEach((c,i) => { const h = maxCount? c/maxCount*plotH : 0; ctx.fillRect(pad+i*barW+2, H-pad-h, barW-4, h); });
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--rule-strong").trim();
      ctx.beginPath(); ctx.moveTo(pad,H-pad); ctx.lineTo(W-pad,H-pad); ctx.stroke();
    }
    dataEl.addEventListener("input", update);
    update();
  }

  function renderSection(id){
    const body = document.getElementById("body-maths");
    if (id==="reference"){ body.innerHTML = renderReference(); }
    else if (id==="unit-circle"){ body.innerHTML = renderUnitCircle(); wireUnitCircle(); }
    else if (id==="graph"){ body.innerHTML = renderGraph(); wireGraph(); }
    else if (id==="solvers"){ body.innerHTML = renderSolvers(); wireQuadratic(); wireSimultaneous(); wireTriangle(); }
    else if (id==="stats"){ body.innerHTML = renderStats(); wireStats(); }
  }

  registerTab({
    id: "maths", label: "Maths", short: "Ma", accent: "--lilac",
    icon: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="2"/><path d="M9 4v16M4 9h16" stroke="currentColor" stroke-width="1.4"/></svg>`,
    searchEntries: SECTIONS.map(s => ({ label: s.label, keywords: s.label.toLowerCase(), route:`#maths/${s.id}`, group:"Maths" })),
    init(){
      const wrap = document.createElement("div");
      wrap.innerHTML = renderSegmented();
      document.getElementById("body-maths").before(wrap.firstElementChild);
      document.getElementById("mathSeg").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-id]");
        if (btn) router.go(`#maths/${btn.dataset.id}`);
      });
      renderSection(activeSection);
    },
    onRoute(rest){
      const id = (rest && rest[0]) || "reference";
      activeSection = SECTIONS.some(s=>s.id===id) ? id : "reference";
      document.querySelectorAll("#mathSeg button").forEach(b => b.setAttribute("aria-selected", b.dataset.id===activeSection));
      renderSection(activeSection);
    }
  });
})();

/* ============================================================
   BOOTSTRAP
   ============================================================ */
function boot(){
  renderRail();
  buildPanelShells();
  buildSearchIndex();
  palette.init();
  shortcutModal.init();

  let initialHash = window.location.hash;
  if (!initialHash){
    const last = store.get("lastTab", "#periodic");
    initialHash = last;
    window.location.hash = last;
  }
  router.fire();

  window.addEventListener("beforeprint", () => {});
  window.addEventListener("afterprint", () => {
    document.querySelectorAll(".panel[data-printing]").forEach(p => p.removeAttribute("data-printing"));
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
</body>
