<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Data Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --paper:        #F3F5F4;
  --paper-sunk:   #E8EDEB;
  --grid:         #D6DEDB;
  --rule:         #C2CCC9;
  --rule-strong:  #8A9A96;

  --ink:          #16232E;
  --ink-2:        #47585F;
  --ink-3:        #7C8C90;

  --signal:       #0F6E63;
  --signal-lift:  #12897C;
  --signal-wash:  #DCEBE8;
  --crimson:      #B3123A;
  --amber:        #C7860B;
  --lilac:        #6E5AC8;
  --strontium:    #D4453B;
  --barium:       #4E9A2F;

  --cat-alkali:        #F6D9D0; --cat-alkali-edge:      #C25A3E;
  --cat-alkaline:      #F8E7C8; --cat-alkaline-edge:    #C08A22;
  --cat-transition:    #DCE7EC; --cat-transition-edge:  #547A8E;
  --cat-post-trans:    #E2E6DE; --cat-post-trans-edge:  #6E7B63;
  --cat-metalloid:     #E5DFF2; --cat-metalloid-edge:   #6E5AC8;
  --cat-nonmetal:      #D9EDDF; --cat-nonmetal-edge:    #35774A;
  --cat-halogen:       #D6EAF0; --cat-halogen-edge:     #2C7C93;
  --cat-noble:         #EDDDE8; --cat-noble-edge:       #8E4A78;
  --cat-lanthanide:    #F1E3D5; --cat-lanthanide-edge:  #A9722F;
  --cat-actinide:      #EEDCDC; --cat-actinide-edge:    #9C4444;
  --cat-unknown:       #E4E7E8; --cat-unknown-edge:     #7C8C90;

  --font-ui:   "Archivo", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;

  --t-xs:  0.75rem;
  --t-sm:  0.875rem;
  --t-base:1rem;
  --t-md:  1.25rem;
  --t-lg:  1.563rem;
  --t-xl:  1.953rem;
  --t-2xl: 3.052rem;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --radius-tile: 2px;
  --radius-panel: 0;
  --radius-control: 6px;

  --shadow-card: 0 8px 28px rgba(22,35,46,.16);
  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:      #10262A;
    --paper-sunk: #0B1D21;
    --grid:       #1C3A3F;
    --rule:       #24474D;
    --rule-strong:#3E6B71;
    --ink:        #E4EFEC;
    --ink-2:      #A3BAB6;
    --ink-3:      #6E8A87;
    --signal:     #4FC7B6;
    --signal-lift:#6FDCCB;
    --signal-wash:#123B3B;
    --crimson:    #FF7A93;
    --amber:      #F0B44A;
    --lilac:      #A996F0;
    --strontium:  #FF7A6B;
    --barium:     #86D45F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:      #10262A;
  --paper-sunk: #0B1D21;
  --grid:       #1C3A3F;
  --rule:       #24474D;
  --rule-strong:#3E6B71;
  --ink:        #E4EFEC;
  --ink-2:      #A3BAB6;
  --ink-3:      #6E8A87;
  --signal:     #4FC7B6;
  --signal-lift:#6FDCCB;
  --signal-wash:#123B3B;
  --crimson:    #FF7A93;
  --amber:      #F0B44A;
  --lilac:      #A996F0;
  --strontium:  #FF7A6B;
  --barium:     #86D45F;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .cat-tile{ --cat-fill-mix: 22%; }
}
:root[data-theme="dark"] .cat-tile{ --cat-fill-mix: 22%; }

/* ============================= BASE ============================= */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--font-ui);
  font-size:var(--t-base);
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,dl,dd{ margin:0; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
a{ color:var(--signal); }
::selection{ background:var(--signal-wash); color:var(--ink); }

:focus-visible{
  outline:2px solid var(--signal);
  outline-offset:2px;
  border-radius:2px;
}
:focus:not(:focus-visible){ outline:none; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.001ms !important;
  }
}

.tabular{ font-variant-numeric: tabular-nums lining-nums; }

/* ============================= LAYOUT ============================= */
.app{
  display:grid;
  grid-template-columns:64px minmax(0,1fr);
  grid-template-rows:56px 1fr;
  grid-template-areas:
    "bar bar"
    "rail main";
  height:100vh;
}

/* graph-paper ground */
#desk{
  grid-area:main;
  position:relative;
  overflow-y:auto;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:20px 20px;
  background-position:-1px -1px;
}
:root:not([data-theme="light"]) #desk{
  background-image:
    linear-gradient(color-mix(in oklab, var(--grid) 55%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in oklab, var(--grid) 55%, transparent) 1px, transparent 1px);
}

.desk-inner{
  max-width:1400px;
  margin:0 auto;
  padding:var(--s5) var(--s5) var(--s7);
}

/* command bar */
.bar{
  grid-area:bar;
  display:flex;
  align-items:center;
  gap:var(--s4);
  padding:0 var(--s4);
  background:var(--paper);
  border-bottom:2px solid var(--ink);
  position:sticky;
  top:0;
  z-index:40;
}
.bar-brand{
  font-weight:700;
  font-size:var(--t-sm);
  letter-spacing:0.02em;
  white-space:nowrap;
  color:var(--ink);
}
.bar-search{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:var(--s2);
  background:var(--paper-sunk);
  border:1px solid var(--rule);
  border-radius:var(--radius-control);
  padding:0 var(--s3);
  height:36px;
  max-width:560px;
}
.bar-search input{
  flex:1;
  min-width:0;
  width:0;
  background:none;
  border:none;
  color:var(--ink);
  font-size:var(--t-sm);
}
@media (max-width:480px){
  .bar-brand{ display:none; }
  .bar-search kbd{ display:none; }
}
.bar-search input::placeholder{ color:var(--ink-3); }
.bar-search kbd{
  font-family:var(--font-ui);
  font-size:var(--t-xs);
  color:var(--ink-3);
  border:1px solid var(--rule);
  border-radius:4px;
  padding:1px 5px;
  background:var(--paper);
}
.bar-actions{ display:flex; align-items:center; gap:var(--s2); margin-left:auto; }
.icon-btn{
  width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  background:none; border:1px solid transparent; border-radius:var(--radius-control);
  color:var(--ink-2);
}
.icon-btn:hover{ background:var(--paper-sunk); color:var(--ink); }
.icon-btn svg{ width:18px; height:18px; }

/* rail */
.rail{
  grid-area:rail;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  background:var(--paper-sunk);
  border-right:1px solid var(--rule);
  padding:var(--s3) 0;
}
.rail-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:var(--s3) 0;
  background:none;
  border:none;
  border-left:3px solid transparent;
  color:var(--ink-2);
  position:relative;
}
.rail-item svg{ width:20px; height:20px; }
.rail-item .rail-label{ font-size:10px; font-weight:600; letter-spacing:0.02em; }
.rail-item:hover{ color:var(--ink); background:color-mix(in oklab, var(--paper) 50%, transparent); }
.rail-item[aria-current="true"]{
  color:var(--accent, var(--signal));
  border-left-color:var(--accent, var(--signal));
  background:var(--paper);
}
.rail-spacer{ flex:1; }

/* panels */
.panel{ display:none; }
.panel[data-active="true"]{ display:block; }
.panel-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:var(--s4);
  flex-wrap:wrap;
  padding-bottom:var(--s3);
  border-bottom:1px solid var(--rule);
  margin-bottom:var(--s4);
}
.panel-title{
  font-size:var(--t-lg);
  font-weight:600;
  color:var(--ink);
}
.panel-title .accent-mark{ color:var(--accent, var(--signal)); }
.panel-tools{ display:flex; gap:var(--s2); flex-wrap:wrap; align-items:center; }

.sheet{
  background:var(--paper);
  border:1px solid var(--rule);
}
.sheet + .sheet{ margin-top:var(--s4); }
.sheet-head{
  padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--rule);
  font-weight:600;
  font-size:var(--t-sm);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--s3);
}
.sheet-body{ padding:var(--s4); }

/* segmented control (chem/phys/maths sub-nav) */
.segmented{
  display:flex;
  flex-wrap:wrap;
  gap:2px;
  background:var(--paper-sunk);
  border:1px solid var(--rule);
  padding:2px;
  margin-bottom:var(--s4);
}
.segmented button{
  background:none;
  border:none;
  padding:var(--s2) var(--s3);
  font-size:var(--t-sm);
  font-weight:500;
  color:var(--ink-2);
  border-radius:2px;
}
.segmented button:hover{ color:var(--ink); }
.segmented button[aria-selected="true"]{
  background:var(--paper);
  color:var(--accent, var(--signal));
  box-shadow:inset 0 0 0 1px var(--rule);
  font-weight:600;
}

/* form controls */
.field{ display:flex; flex-direction:column; gap:4px; }
.field label{ font-size:var(--t-xs); color:var(--ink-2); font-weight:500; }
input[type="text"], input[type="number"], input[type="search"], select, textarea{
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:var(--radius-control);
  padding:var(--s2) var(--s3);
  font-size:var(--t-sm);
  color:var(--ink);
}
textarea{ font-family:var(--font-ui); resize:vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{ outline-offset:1px; }
.btn{
  background:var(--paper);
  border:1px solid var(--rule-strong);
  border-radius:var(--radius-control);
  padding:var(--s2) var(--s4);
  font-size:var(--t-sm);
  font-weight:600;
  color:var(--ink);
  transition:background 120ms ease-out, color 120ms ease-out;
}
.btn:hover{ background:var(--paper-sunk); }
.btn-primary{
  background:var(--accent, var(--signal));
  border-color:var(--accent, var(--signal));
  color:var(--paper);
}
.btn-primary:hover{ background:var(--accent-lift, var(--signal-lift)); border-color:var(--accent-lift, var(--signal-lift)); }
.btn-sm{ padding:4px var(--s3); font-size:var(--t-xs); }

table{ width:100%; border-collapse:collapse; font-size:var(--t-sm); }
th,td{ text-align:left; padding:var(--s2) var(--s3); border-bottom:1px solid var(--rule); }
thead th{ font-size:var(--t-xs); color:var(--ink-2); font-weight:600; text-transform:none; border-bottom:1px solid var(--rule-strong); }
tbody tr:nth-child(even){ background:var(--paper-sunk); }
.table-wrap{ overflow-x:auto; }

.prose{
  font-family:var(--font-read);
  font-size:var(--t-base);
  line-height:1.6;
  max-width:68ch;
  color:var(--ink);
}

.hint{ font-size:var(--t-xs); color:var(--ink-2); }
.err{ font-size:var(--t-xs); color:var(--crimson); font-weight:500; }
.badge{
  display:inline-flex; align-items:center;
  font-size:var(--t-xs); font-weight:600;
  padding:2px 8px; border-radius:100px;
  background:var(--signal-wash); color:var(--signal);
}

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s4); }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s4); }
@media (max-width:800px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

.empty-state{
  padding:var(--s6);
  text-align:center;
  color:var(--ink-2);
  font-size:var(--t-sm);
}

/* ============================= COMMAND PALETTE ============================= */
.palette-overlay{
  position:fixed; inset:0;
  background:rgba(16,20,22,.35);
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding-top:12vh;
  z-index:100;
}
.palette-overlay[data-open="true"]{ display:flex; }
.palette{
  width:min(600px, 92vw);
  background:var(--paper);
  border:1px solid var(--rule-strong);
  box-shadow:var(--shadow-card);
  max-height:60vh;
  display:flex;
  flex-direction:column;
}
.palette-input{
  padding:var(--s4);
  border-bottom:1px solid var(--rule);
  display:flex;
  gap:var(--s2);
  align-items:center;
}
.palette-input input{ flex:1; border:none; background:none; font-size:var(--t-md); }
.palette-results{ overflow-y:auto; padding:var(--s2) 0; }
.palette-group-label{ font-size:var(--t-xs); color:var(--ink-3); padding:var(--s2) var(--s4) 4px; font-weight:600; }
.palette-item{
  display:flex; align-items:center; gap:var(--s3);
  padding:var(--s2) var(--s4);
  border-left:3px solid var(--item-accent, transparent);
  cursor:pointer;
}
.palette-item:hover, .palette-item[data-active="true"]{ background:var(--paper-sunk); }
.palette-item-label{ font-weight:500; font-size:var(--t-sm); }
.palette-item-meta{ font-size:var(--t-xs); color:var(--ink-3); margin-left:auto; }

/* ============================= MODAL / SHORTCUT SHEET ============================= */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(16,20,22,.35);
  display:none;
  align-items:center; justify-content:center;
  z-index:100;
  padding:var(--s4);
}
.modal-overlay[data-open="true"]{ display:flex; }
.modal{
  width:min(520px,92vw);
  max-height:80vh;
  overflow-y:auto;
  background:var(--paper);
  border:1px solid var(--rule-strong);
  box-shadow:var(--shadow-card);
  padding:var(--s5);
}
.modal h2{ font-size:var(--t-md); font-weight:600; margin-bottom:var(--s4); }
.kbd-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--rule); font-size:var(--t-sm); }
.kbd-row kbd{ font-family:var(--font-ui); background:var(--paper-sunk); border:1px solid var(--rule); border-radius:4px; padding:1px 6px; }

/* ============================= PRINT ============================= */
@page{ size: A4 landscape; margin: 12mm; }
@media print{
  .bar, .rail, .panel-tools, .palette-overlay, .modal-overlay, .no-print{ display:none !important; }
  #desk{ background-image:none; overflow:visible; height:auto; }
  .app{ display:block; height:auto; }
  .desk-inner{ max-width:none; padding:0; }
  .panel{ display:none !important; }
  .panel[data-printing="true"]{ display:block !important; }
  body{ background:#fff; color:#000; }
}

/* ============================================================ PERIODIC TABLE ============================================================ */
.pt-controls-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:var(--s4); flex-wrap:wrap; margin-bottom:var(--s4); }
.pt-controls-row input[type="range"]{ width:100%; accent-color:var(--signal); }
.pt-grid-wrap{ overflow-x:auto; padding-bottom:var(--s3); }
.periodic-grid{
  display:grid;
  grid-template-columns:repeat(18, minmax(48px, 1fr));
  grid-auto-rows:minmax(48px, 1fr);
  gap:3px;
  min-width:1000px;
}
.element-tile{
  position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:1px solid var(--cat-unknown-edge);
  border-radius:var(--radius-tile);
  padding:2px;
  min-width:0;
  transition:opacity 120ms ease-out, transform 120ms ease-out;
  color:var(--ink);
}
.element-tile:hover{ transform:translateY(-1px); box-shadow:0 2px 6px rgba(22,35,46,.18); z-index:2; }
.et-num{ position:absolute; top:2px; left:3px; font-size:9px; color:var(--ink-2); }
.et-sym{ font-weight:600; font-size:var(--t-sm); line-height:1; }
.et-name{ font-size:8px; color:var(--ink-2); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.et-mass{ font-size:8px; color:var(--ink-3); }
@media (max-width:900px){ .et-name{ display:none; } }
@media (max-width:700px){ .et-mass{ display:none; } }

.element-detail{ display:none; }
.element-detail[data-open="true"]{
  display:block;
  position:fixed;
  top:50%; left:50%; transform:translate(-50%,-50%);
  width:min(480px, 92vw);
  max-height:82vh;
  overflow-y:auto;
  z-index:60;
  box-shadow:var(--shadow-card);
  border:1px solid var(--rule-strong);
}
.detail-inner{ position:relative; padding:var(--s5); }
.detail-top{ display:flex; gap:var(--s4); align-items:center; margin-bottom:var(--s4); }
.detail-symbol{
  font-size:var(--t-2xl); font-weight:700; line-height:1;
  width:88px; height:88px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--paper); border:2px solid; border-radius:var(--radius-tile);
}
.detail-top h2{ font-size:var(--t-md); font-weight:600; }
.detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s3) var(--s4); margin-bottom:var(--s4); }
.detail-grid dt{ font-size:var(--t-xs); color:var(--ink-2); }
.detail-grid dd{ font-size:var(--t-sm); font-weight:500; }
.detail-shell{ display:flex; justify-content:center; margin-bottom:var(--s3); }

/* ============================================================ CHEMISTRY ============================================================ */
.sol-grid td{ text-align:center; font-size:var(--t-xs); cursor:default; }
.sol-grid th{ font-size:var(--t-xs); }
.sol-sol{ background:color-mix(in oklab, var(--barium) 18%, var(--paper)); }
.sol-insol{ background:color-mix(in oklab, var(--crimson) 16%, var(--paper)); }
.sol-slight{ background:color-mix(in oklab, var(--amber) 18%, var(--paper)); }

/* ============================================================ MATHS ============================================================ */
.uc-wrap{ display:flex; gap:var(--s5); flex-wrap:wrap; align-items:flex-start; }
#ucSvg{ flex-shrink:0; background:var(--paper-sunk); border:1px solid var(--rule); }
#ucHandle{ touch-action:none; }

/* animations */
@media (prefers-reduced-motion:no-preference){
  .element-tile{ animation: tile-in 220ms ease-out backwards; }
  @keyframes tile-in{ from{ opacity:0; transform:translateY(2px); } to{ opacity:1; transform:none; } }
  .card-pop{ animation: card-in 160ms ease-out; }
  @keyframes card-in{ from{ opacity:0; transform:scale(.98); } to{ opacity:1; transform:none; } }
}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="bar-brand">The Data Desk</div>
    <div class="bar-search" id="openPaletteBtn" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="paletteTrigger" placeholder="Search anything — press /" readonly>
      <kbd>/</kbd>
    </div>
    <div class="bar-actions">
      <button class="icon-btn no-print" id="shortcutBtn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11h.01M11 11h.01M15 11h.01M17 11h.01M7 15h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn no-print" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" id="themeIcon"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

const AUFBAU_ORDER = ["1s","2s","2p","3s","3p","4s","3d","4p","5s","4d","5p","6s","4f","5d","6p","7s","5f","6d","7p"];

  96:"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p6 5f7 6d1 7s2",
  103:"1s2 2s2 2p6 3s2 3p6 3d10 4s2 4p6 4d10 4f14 5s2 5p6 5d10 6s2 6p6 5f14 7s2 7p1"
};
const L_ORDER = { s:0, p:1, d:2, f:3 };
function configDisplayOrder(str){
  const parts = str.split(" ").map(p=>{
    const n = parseInt(p,10);
    const l = p.match(/[a-z]/)[0];
    return { n, l, str:p };
  });
  parts.sort((a,b)=> a.n-b.n || L_ORDER[a.l]-L_ORDER[b.l]);
  return parts.map(p=>p.str).join(" ");
}
function buildElectronConfig(Z){
  if (CONFIG_EXCEPTIONS[Z]) return configDisplayOrder(CONFIG_EXCEPTIONS[Z]);
  let remaining = Z;
  const parts = [];
  for (const sub of AUFBAU_ORDER){
    const l = sub[sub.length-1];
    const take = Math.min(SUB_CAP[l], remaining);
    if (take > 0) parts.push(sub+take);
    remaining -= take;
    if (remaining <= 0) break;
  }
  return configDisplayOrder(parts.join(" "));
}
const NOBLE_Z = [2,10,18,36,54,86,118];
const NOBLE_SYM = {2:"He",10:"Ne",18:"Ar",36:"Kr",54:"Xe",86:"Rn",118:"Og"};
function toNobleShorthand(Z, fullConfig){
  let coreZ = 0;
  for (const n of NOBLE_Z){ if (n < Z) coreZ = n; else break; }
  if (coreZ === 0) return fullConfig;
  const coreParts = new Set(buildElectronConfig(coreZ).split(" "));
  const remaining = fullConfig.split(" ").filter(p => !coreParts.has(p));
  return "["+NOBLE_SYM[coreZ]+"] "+remaining.join(" ");
}
function toShellCounts(fullConfig){
  const shells = {};
  for (const part of fullConfig.split(" ")){
    const n = parseInt(part[0],10);
    const count = parseInt(part.slice(2),10);
    shells[n] = (shells[n]||0) + count;
  }
  const maxN = Math.max(...Object.keys(shells).map(Number));
  const arr = [];
  for (let n=1; n<=maxN; n++) arr.push(shells[n]||0);
  return arr;
}

/* ============================================================
   STORE — localStorage wrapper, versioned schema
   ============================================================ */
const SCHEMA_VERSION = 1;
const store = {
  _ok: (() => { try { const k="dd:__test__"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; } catch(e){ return false; } })(),
  get(key, fallback){
    if (!this._ok) return fallback;
    try {
      const raw = localStorage.getItem("dd:"+key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch(e){ return fallback; }
  },
  set(key, value){
    if (!this._ok) return;
    try { localStorage.setItem("dd:"+key, JSON.stringify(value)); } catch(e){}
  },
  init(){
    const v = this.get("v", null);
    if (v === null) {
      this.set("v", SCHEMA_VERSION);
      this.set("theme", "system");
      this.set("recent", []);
      this.set("pinned", []);
      this.set("notes", "");
    }
    // future schema migrations go here, keyed on stored version number
  },
  pushRecent(item){
    const recent = this.get("recent", []).filter(r => r.route !== item.route);
    recent.unshift({ ...item, at: Date.now() });
    this.set("recent", recent.slice(0, 12));
  }
};
store.init();

const themeCtl = {
  apply(mode){
    const root = document.documentElement;
    if (mode === "light" || mode === "dark") root.setAttribute("data-theme", mode);
    else root.removeAttribute("data-theme");
    store.set("theme", mode);
    this.updateIcon(mode);
  },
  current(){ return store.get("theme", "system"); },
  toggle(){
    const order = ["system","light","dark"];
    const next = order[(order.indexOf(this.current())+1) % order.length];
    this.apply(next);
  },
  updateIcon(mode){
    const icon = document.getElementById("themeIcon");
    if (!icon) return;
    icon.innerHTML = mode === "dark"
      ? '<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>'
      : '<circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
  }

/* ============================================================
   ROUTER — hash based, "#tab/sub/detail"
   ============================================================ */
const router = {
  listeners: [],
  on(fn){ this.listeners.push(fn); },
  parse(hash){
    const clean = (hash || "").replace(/^#/, "");
    const [tab, ...rest] = clean.split("/");
    return { tab: tab || null, rest, full: clean };
  },
  go(route){ window.location.hash = route.startsWith("#") ? route : "#"+route; },
  current(){ return this.parse(window.location.hash); },
  fire(){ const r = this.current(); this.listeners.forEach(fn => fn(r)); }
};
window.addEventListener("hashchange", () => router.fire());

const TABS = [];
function registerTab(def){ TABS.push(def); }

function renderRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  TABS.forEach((tab, idx) => {
    const btn = document.createElement("button");
    btn.className = "rail-item";
    btn.style.setProperty("--accent", `var(${tab.accent})`);
    btn.dataset.tab = tab.id;
    btn.setAttribute("aria-label", tab.label);
    btn.innerHTML = tab.icon + `<span class="rail-label">${tab.short}</span>`;
    btn.addEventListener("click", () => router.go("#"+tab.id));
    rail.appendChild(btn);
  });
}

function activateTab(tabId, rest){
  const tab = TABS.find(t => t.id === tabId) || TABS[0];
  document.querySelectorAll(".rail-item").forEach(b => {
    b.setAttribute("aria-current", b.dataset.tab === tab.id ? "true" : "false");
  });
  document.querySelectorAll(".panel").forEach(p => {
    p.dataset.active = (p.dataset.tab === tab.id) ? "true" : "false";
  });
  if (!tab._initDone) { tab.init(); tab._initDone = true; }
  if (tab.onRoute) tab.onRoute(rest);
  store.set("lastTab", "#"+tab.id+(rest && rest.length ? "/"+rest.join("/") : ""));
  document.title = tab.label + " — The Data Desk";
}

function buildPanelShells(){
  const inner = document.getElementById("deskInner");
  TABS.forEach(tab => {
    const section = document.createElement("section");
    section.className = "panel";
    section.dataset.tab = tab.id;
    section.style.setProperty("--accent", `var(${tab.accent})`);
    section.style.setProperty("--accent-lift", `var(${tab.accentLift || tab.accent})`);

let SEARCH_INDEX = [];
function buildSearchIndex(){
  const idx = [];
  ELEMENTS.forEach(([Z,sym,name]) => {
    idx.push({ label: `${name} (${sym})`, keywords: `${name} ${sym} ${Z} element`.toLowerCase(), tab:"periodic", route:`#periodic/${sym}`, group:"Periodic table", accent:"--signal" });
  });
  TABS.forEach(tab => {
    idx.push({ label: tab.label, keywords: tab.label.toLowerCase(), tab: tab.id, route:"#"+tab.id, group:"Tabs", accent: tab.accent });
    (tab.searchEntries || []).forEach(e => idx.push({ ...e, tab: tab.id, accent: tab.accent }));
  });
  SEARCH_INDEX = idx;
}

const palette = {
  overlay: null, input: null, results: null, activeIndex: 0, items: [],
  init(){
    this.overlay = document.getElementById("paletteOverlay");
    this.input = document.getElementById("paletteInput");
    this.results = document.getElementById("paletteResults");
    document.getElementById("openPaletteBtn").addEventListener("click", () => this.open());
    this.overlay.addEventListener("click", (e) => { if (e.target === this.overlay) this.close(); });
    this.input.addEventListener("input", () => this.filter());
    this.input.addEventListener("keydown", (e) => this.onKey(e));
  },
  open(){
    this.overlay.dataset.open = "true";
    this.input.value = "";
    this.filter();
    setTimeout(() => this.input.focus(), 0);
  },
  close(){ this.overlay.dataset.open = "false"; },
  isOpen(){ return this.overlay.dataset.open === "true"; },
  filter(){
    const q = this.input.value.trim().toLowerCase();
    let list;
    if (!q) {
      const recent = store.get("recent", []);
      list = recent.map(r => ({ label:r.label, keywords:"", tab:r.tab, route:r.route, group:"Recent", accent:r.accent||"--signal" }));
      if (!list.length) list = SEARCH_INDEX.slice(0, 8);
    } else {
      list = SEARCH_INDEX.filter(e => e.keywords.includes(q) || e.label.toLowerCase().includes(q))
        .sort((a,b) => a.keywords.indexOf(q) - b.keywords.indexOf(q))
        .slice(0, 40);
    }
    this.items = list;
    this.activeIndex = 0;
    this.renderResults();
  },
  renderResults(){
    if (!this.items.length){
      this.results.innerHTML = `<div class="empty-state">No matches. Try an element symbol, a formula, or a tool name.</div>`;
      return;
    }
    let lastGroup = null;
    let html = "";
    this.items.forEach((item, i) => {
      if (item.group !== lastGroup){
        html += `<div class="palette-group-label">${item.group}</div>`;
        lastGroup = item.group;
      }
      html += `<div class="palette-item" data-idx="${i}" style="--item-accent:var(${item.accent})" aria-selected="${i===this.activeIndex}">
        <span class="palette-item-label">${item.label}</span>
        <span class="palette-item-meta">${item.tab}</span>
      </div>`;
    });
    this.results.innerHTML = html;
    this.results.querySelectorAll(".palette-item").forEach(el => {
      el.addEventListener("click", () => this.select(parseInt(el.dataset.idx,10)));
    });
    this.highlight();
  },
  highlight(){
    this.results.querySelectorAll(".palette-item").forEach((el,i) => {
      el.dataset.active = (i === this.activeIndex) ? "true" : "false";
    });
    const activeEl = this.results.querySelector(`[data-idx="${this.activeIndex}"]`);
    if (activeEl) activeEl.scrollIntoView({ block:"nearest" });
  },
  select(i){
    const item = this.items[i];
    if (!item) return;
    store.pushRecent({ label:item.label, tab:item.tab, route:item.route, accent:item.accent });
    router.go(item.route);
    this.close();
  },
  onKey(e){
    if (e.key === "ArrowDown"){ e.preventDefault(); this.activeIndex = Math.min(this.activeIndex+1, this.items.length-1); this.highlight(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); this.activeIndex = Math.max(this.activeIndex-1, 0); this.highlight(); }
    else if (e.key === "Enter"){ e.preventDefault(); this.select(this.activeIndex); }
    else if (e.key === "Escape"){ e.preventDefault(); this.close(); }
  }
};

function isTypingTarget(el){
  return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
}
const shortcutModal = {
  overlay: null,
  init(){

    this.overlay.addEventListener("click", (e) => { if (e.target === this.overlay) this.close(); });
  },
  open(){ this.overlay.dataset.open = "true"; },
  close(){ this.overlay.dataset.open = "false"; },
  isOpen(){ return this.overlay.dataset.open === "true"; }
};

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape"){
    if (palette.isOpen()) return palette.close();
    if (shortcutModal.isOpen()) return shortcutModal.close();
    const active = TABS.find(t => t._initDone) ;
    document.dispatchEvent(new CustomEvent("dd:escape"));
    return;
  }
  if (palette.isOpen() || isTypingTarget(e.target)) return;
  if (e.key === "/" ){ e.preventDefault(); palette.open(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); palette.open(); return; }
  if (e.key === "?"){ e.preventDefault(); shortcutModal.open(); return; }
  if (e.key === "t" || e.key === "T"){ e.preventDefault(); themeCtl.toggle(); return; }
  if (/^[1-5]$/.test(e.key)){
    const tab = TABS[parseInt(e.key,10)-1];
    if (tab) router.go("#"+tab.id);
  }
});
document.getElementById("themeBtn").addEventListener("click", () => themeCtl.toggle());

/* ============================================================
   TAB: Periodic table
   ============================================================ */
(function(){
  const CATEGORY_LABEL = {
    alkali:"Alkali metal", alkaline:"Alkaline earth metal", transition:"Transition metal",
    "post-transition":"Post-transition metal", metalloid:"Metalloid", nonmetal:"Nonmetal",
    halogen:"Halogen", noble:"Noble gas", lanthanide:"Lanthanide", actinide:"Actinide", unknown:"Unknown"
  };
  function getBlock(cat, group, period){
    if (cat === "lanthanide" || cat === "actinide") return "f";
    if (group === 1 || group === 2) return "s";
    if (period === 1 && group === 18) return "s"; // helium
    if (group >= 13 && group <= 18) return "p";
    return "d";
  }
  let els = [];
  let selected = null; // {Z}
  let gridEl, detailCard;

  function buildElements(){
    els = ELEMENTS.map(([Z,sym,name,mass,category,group,period]) => {
      const ext = EXT[sym] || {};
      const cfg = buildElectronConfig(Z);
      return {
        Z, sym, name, mass, category, group, period,
        block: getBlock(category, group, period),
        config: cfg, shorthand: toNobleShorthand(Z, cfg), shells: toShellCounts(cfg),
        ext
      };
    });
  }

  function tileEl(e){
    const btn = document.createElement("button");
    btn.className = "element-tile cat-tile";
    btn.type = "button";
    btn.tabIndex = 0;
    btn.dataset.z = e.Z;
    btn.dataset.group = e.group || "";
    btn.dataset.period = e.period;
    btn.setAttribute("aria-label", `${e.name}, atomic number ${e.Z}`);
    btn.style.gridColumn = e.group ? e.group : (3 + (e.category==="lanthanide" ? e.Z-58 : e.Z-90));
    btn.style.gridRow = e.group ? e.period : (e.category==="lanthanide" ? 9 : 10);
    btn.style.animationDelay = (e.Z * 2) + "ms";
    btn.style.background = `color-mix(in oklab, var(--cat-${e.category}) var(--cat-fill-mix, 100%), var(--paper))`;
    btn.style.borderColor = `var(--cat-${e.category}-edge)`;
    btn.innerHTML = `
      <span class="et-num tabular">${e.Z}</span>
      <span class="et-sym">${e.sym}</span>
      <span class="et-name">${e.name}</span>
      <span class="et-mass tabular">${typeof e.mass === "string" ? e.mass : e.mass.toFixed(3)}</span>
    `;
    btn.addEventListener("click", () => router.go(`#periodic/${e.sym}`));
    btn.addEventListener("keydown", (ev) => handleTileKey(ev, e));
    return btn;
  }

  function handleTileKey(ev, e){
    const deltas = { ArrowRight:[1,0], ArrowLeft:[-1,0], ArrowDown:[0,1], ArrowUp:[0,-1] };
    if (ev.key === "Enter"){ ev.preventDefault(); router.go(`#periodic/${e.sym}`); return; }
    const d = deltas[ev.key];
    if (!d) return;
    ev.preventDefault();
    let g = (e.group || (3 + (e.category==="lanthanide"?e.Z-58:e.Z-90))) + d[0];
    let p = (e.group ? e.period : (e.category==="lanthanide"?9:10)) + d[1];
    const target = Array.from(gridEl.children).find(t => parseInt(t.style.gridColumn,10)===g && parseInt(t.style.gridRow,10)===p);
    if (target) target.focus();
  }

  function renderGrid(){
    gridEl.innerHTML = "";
    els.forEach(e => gridEl.appendChild(tileEl(e)));
    applyColourMode();
  }

  function applySearch(q){
    const query = q.trim().toLowerCase();
    gridEl.querySelectorAll(".element-tile").forEach(t => {
      const e = els.find(x => x.Z === parseInt(t.dataset.z,10));
      const match = !query || e.name.toLowerCase().includes(query) || e.sym.toLowerCase().includes(query) || String(e.Z) === query;
      t.style.opacity = match ? "1" : "0.15";
    });
  }

  let colourMode = "category";
  function applyColourMode(){
    gridEl.querySelectorAll(".element-tile").forEach(t => {
      const e = els.find(x => x.Z === parseInt(t.dataset.z,10));
      t.title = "";
      if (colourMode === "category"){
        t.style.background = `color-mix(in oklab, var(--cat-${e.category}) var(--cat-fill-mix, 100%), var(--paper))`; t.style.borderColor = `var(--cat-${e.category}-edge)`;
      } else if (colourMode === "state"){
        const phase = e.ext.phase || "unknown";
        const map = { solid:"--rule-strong", liquid:"--signal", gas:"--lilac", unknown:"--rule" };
        t.style.background = "var(--paper-sunk)"; t.style.borderColor = `var(${map[phase]||"--rule"})`;
      } else if (colourMode === "metal"){
        const metal = !["nonmetal","halogen","noble","metalloid"].includes(e.category);
        const map = metal ? "--rule-strong" : (e.category==="metalloid" ? "--lilac" : "--signal");
        t.style.background = "var(--paper-sunk)"; t.style.borderColor = `var(${map})`;
      }
    });
  }

  function applyTemperature(K){
    gridEl.querySelectorAll(".element-tile").forEach(t => {
      const e = els.find(x => x.Z === parseInt(t.dataset.z,10));
      const { mp, bp } = e.ext;
      if (mp == null || bp == null){ t.style.opacity = "0.35"; return; }
      t.style.opacity = "1";
      let state = K < mp ? "solid" : (K < bp ? "liquid" : "gas");
      const map = { solid:"--rule-strong", liquid:"--signal", gas:"--lilac" };
      t.style.borderColor = `var(${map[state]})`;
      t.style.borderWidth = "2px";
      t.title = `${e.name}: ${state} at ${K} K`;
    });
  }

  function shellSVG(shells){
    const cx=60, cy=60;
    let svg = `<svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Electron shell diagram">`;
    svg += `<circle cx="${cx}" cy="${cy}" r="4" fill="var(--ink)"/>`;
    shells.forEach((count, i) => {
      const r = 12 + i*13;
      svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--rule-strong)" stroke-width="1"/>`;
      for (let k=0;k<count;k++){
        const ang = (k / count) * Math.PI*2 - Math.PI/2;
        const x = cx + r*Math.cos(ang), y = cy + r*Math.sin(ang);
        svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="var(--signal)"/>`;
      }
    });
    svg += `</svg>`;
    return svg;
  }

  function kToC(k){ return k==null ? null : Math.round((k - 273.15)*10)/10; }

  function openDetail(sym){
    const e = els.find(x => x.sym === sym);
    if (!e) return;
    selected = e;
    const x = e.ext;
    detailCard.innerHTML = `
      <div class="detail-inner card-pop cat-tile" style="background:color-mix(in oklab, var(--cat-${e.category}) var(--cat-fill-mix, 100%), var(--paper));">
        <button class="icon-btn detail-close" aria-label="Close" style="position:absolute;top:8px;right:8px;">✕</button>
        <div class="detail-top">
          <div class="detail-symbol" style="border-color:var(--cat-${e.category}-edge)">${e.sym}</div>
          <div>
            <h2>${e.name}</h2>
            <div class="hint">Z = ${e.Z} · ${typeof e.mass==="string"?e.mass:e.mass.toFixed(3)} · ${CATEGORY_LABEL[e.category]||e.category}</div>
            <div class="hint">Group ${e.group||"—"} · Period ${e.period}</div>
          </div>
        </div>
        <dl class="detail-grid">
          <div><dt>Electrons per shell</dt><dd class="tabular">${e.shells.join(", ")}</dd></div>
          <div><dt>State at room temperature</dt><dd>${x.phase||"—"}</dd></div>
          <div><dt>Melting point</dt><dd>${x.mp!=null? `${kToC(x.mp)} °C`:"—"}</dd></div>
          <div><dt>Boiling point</dt><dd>${x.bp!=null? `${kToC(x.bp)} °C`:"—"}</dd></div>
          <div><dt>Density</dt><dd>${x.density!=null? x.density+" g/cm³":"—"}</dd></div>
          <div><dt>Discovered</dt><dd>${x.discovered!=null? (x.discovered<0? Math.abs(x.discovered)+" BCE":x.discovered):"—"} · ${x.by||"—"}</dd></div>
        </dl>
        <div class="detail-shell">${shellSVG(e.shells)}</div>
        <p class="prose" style="font-size:var(--t-sm);">${x.use||""}</p>
        <button class="btn btn-sm" id="copyElData">Copy data</button>
      </div>
    `;
    detailCard.dataset.open = "true";
    detailCard.querySelector(".detail-close").addEventListener("click", () => router.go("#periodic"));
    detailCard.querySelector("#copyElData").addEventListener("click", () => {
      const row = [e.sym,e.name,e.Z,e.mass,e.category,e.group,e.period,e.shells.join("-"),x.mp,x.bp,x.density,x.phase,x.discovered,x.by,x.use].join("\t");
      navigator.clipboard && navigator.clipboard.writeText(row).catch(()=>{});
    });
    store.pushRecent({ label:`${e.name} (${e.sym})`, tab:"periodic", route:`#periodic/${e.sym}`, accent:"--signal" });
  }
  function closeDetail(){
    detailCard.dataset.open = "false";
    selected = null;
  }

  registerTab({
    id: "periodic", label: "Periodic table", short: "Pe", accent: "--signal",
    icon: `<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="2"/><rect x="10.5" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="2"/><rect x="18" y="3" width="3" height="6" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="10.5" width="6" height="6" rx="1" stroke="currentColor" stroke-width="2"/><rect x="10.5" y="10.5" width="6" height="6" rx="1" stroke="currentColor" stroke-width="2"/></svg>`,
    searchEntries: [],
    init(){
      buildElements();
      const tools = document.getElementById("tools-periodic");
      tools.innerHTML = `
        <input type="search" id="ptSearch" placeholder="Filter by name, symbol, number…" style="width:220px;">
        <select id="ptColour">
          <option value="category">Colour: Category</option>
          <option value="state">Colour: State at 25 °C</option>
          <option value="metal">Colour: Metal–nonmetal</option>
        </select>
        <button class="btn btn-sm no-print" id="ptPrint">Print table</button>
      `;
      const body = document.getElementById("body-periodic");
      body.innerHTML = `
        <div class="pt-controls-row">
          <label class="field" style="max-width:340px;">
            <span>Temperature — recolours tiles by predicted state</span>
            <input type="range" id="ptTemp" min="0" max="6000" value="298" step="10">
            <span class="hint tabular" id="ptTempLabel">298 K (25 °C)</span>
          </label>
          <div class="hint" id="ptLegend"></div>
        </div>
        <div class="pt-grid-wrap"><div class="periodic-grid" id="ptGrid"></div></div>
      `;
      gridEl = document.getElementById("ptGrid");
      detailCard = document.createElement("div");
      detailCard.className = "element-detail";
      detailCard.dataset.open = "false";
      body.appendChild(detailCard);

      renderGrid();

      document.getElementById("ptSearch").addEventListener("input", (e) => applySearch(e.target.value));
      document.getElementById("ptColour").addEventListener("change", (e) => { colourMode = e.target.value; applyColourMode(); });
      const tempInput = document.getElementById("ptTemp");
      tempInput.addEventListener("input", (e) => {
        const K = parseInt(e.target.value,10);
        document.getElementById("ptTempLabel").textContent = `${K} K (${Math.round(K-273.15)} °C)`;
        applyTemperature(K);
      });
      document.getElementById("ptPrint").addEventListener("click", () => {

        panel.dataset.printing = "true";

        setTimeout(() => panel.dataset.printing = "false", 500);
      });
      document.addEventListener("click", (e) => {
        if (detailCard.dataset.open === "true" && !detailCard.contains(e.target) && !e.target.closest(".element-tile")){
          router.go("#periodic");
        }
      });
      document.addEventListener("dd:escape", () => { if (detailCard.dataset.open === "true") router.go("#periodic"); });
    },
    onRoute(rest){
      if (rest && rest[0]) openDetail(rest[0]);
      else closeDetail();
    }
  });
})();

      const t = parseFloat(temp.value);

      let state = t < s.mp ? "a solid" : (t < s.bp ? "a liquid" : "a gas");
      out.innerHTML = `At ${t} °C, <strong>${s.name}</strong> is <strong>${state}</strong>. (Melts at ${s.mp} °C, boils at ${s.bp} °C.)${s.note ? " — " + s.note : ""}`;

  function renderMixtures(){
    return `
      <div class="sheet"><div class="sheet-head">Elements, compounds &amp; mixtures</div><div class="sheet-body table-wrap">

      <div class="grid-2">

        </div></div>

        <div class="field" style="max-width:360px;margin-bottom:var(--s4);">
          <label for="solverPick">Formula</label>
          <select id="solverPick">${FORMULAS.map(f=>`<option value="${f.id}">${f.label}</option>`).join("")}</select>
        </div>
        <div id="solverFields"></div>
        <div id="solverOut" style="margin-top:var(--s4);"></div>
      </div></div>
    `;
  }
  function wireSolver(){
    const pick = document.getElementById("solverPick");
    const fields = document.getElementById("solverFields");
    const out = document.getElementById("solverOut");
    function build(){
      const f = FORMULAS.find(x=>x.id===pick.value);
      fields.innerHTML = `<div class="grid-3">${f.vars.map(([key,label,unit])=>`
        <div class="field"><label>${label} (${unit})</label><input type="number" step="any" data-key="${key}" value=""></div>
      `).join("")}</div><p class="hint" style="margin-top:var(--s2);">Leave exactly one field blank — that's the one it solves for.</p>`;
      fields.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => compute(f)));
      compute(f);
    }
    function compute(f){
      const inputs = Array.from(fields.querySelectorAll("input"));
      const blanks = inputs.filter(i => i.value.trim()==="");
      if (blanks.length !== 1){ out.innerHTML = `<p class="hint">${blanks.length===0?"All fields filled — clear one to solve for it.":"Leave exactly one field blank."}</p>`; return; }
      const missing = blanks[0].dataset.key;
      const known = {};
      inputs.forEach(i => { if (i.dataset.key !== missing) known[i.dataset.key] = parseFloat(i.value); });
      const result = f.solve(known, missing);
      if (!isFinite(result)){ out.innerHTML = `<p class="err">No real solution for these values.</p>`; return; }
      out.innerHTML = `<p class="prose" style="font-size:var(--t-sm);">Rearranged: <strong class="tabular">${f.rearranged[missing]}</strong></p>
        <p style="font-size:var(--t-md);font-weight:600;">${missing} = <span class="tabular">${Number(result.toPrecision(6))}</span></p>`;
    }
    pick.addEventListener("change", build);
    build();
  }

  function wireNumber(){

    function updateN(){
      const n = parseInt(nEl.value,10);

      const factors = [];
      for (let i=1;i<=n;i++) if (n%i===0) factors.push(i);

      fracEl.value = `${num/g}/${denom/g}`;

          <table><thead><tr><th>Term</th><th>Meaning</th><th>Example</th></tr></thead>
          <tbody>${ALGEBRA_VOCAB.map(v=>`<tr><td style="font-weight:600;">${v.term}</td><td>${v.def}</td><td class="tabular">${v.example}</td></tr>`).join("")}</tbody></table>
        </div></div>
        <div class="sheet"><div class="sheet-head">Simplifying expressions</div><div class="sheet-body prose" style="font-size:var(--t-sm);">
          <ul style="padding-left:1.2em;">${SIMPLIFY_EXAMPLES.map(e=>`<li class="tabular">${e}</li>`).join("")}</ul>
        </div></div>
      </div>
      <div class="sheet"><div class="sheet-head">Solve ax + b = c</div><div class="sheet-body">
        <div class="grid-3">
          <div class="field"><label>a</label><input type="number" id="eqA" value="3"></div>
          <div class="field"><label>b</label><input type="number" id="eqB" value="4"></div>
          <div class="field"><label>c</label><input type="number" id="eqC" value="19"></div>
        </div>
        <p id="eqOut" class="prose" style="margin-top:var(--s3);font-size:var(--t-sm);"></p>
      </div></div>
    `;
  }
  function wireAlgebra(){
    const a=document.getElementById("eqA"), b=document.getElementById("eqB"), c=document.getElementById("eqC"), out=document.getElementById("eqOut");
    function update(){
      const A=parseFloat(a.value), B=parseFloat(b.value), C=parseFloat(c.value);
      if (![A,B,C].every(isFinite) || A===0){ out.innerHTML=""; return; }
      const x = (C-B)/A;
      out.innerHTML = `${A}x + ${B} = ${C}<br>${A}x = ${C} − ${B} = ${Number((C-B).toPrecision(6))}<br><strong>x = ${Number((C-B).toPrecision(6))} ÷ ${A} = ${Number(x.toPrecision(6))}</strong>`;
    }
    [a,b,c].forEach(el=>el.addEventListener("input",update)); update();
  }

  /* ---- Geometry ---- */
  function renderAreaSolver(){
    return `
      <div class="sheet"><div class="sheet-head">Calculate — area &amp; circumference</div><div class="sheet-body">
        <div class="field" style="max-width:360px;margin-bottom:var(--s4);">
          <label for="areaPick">Formula</label>
          <select id="areaPick">${AREA_FORMULAS.map(f=>`<option value="${f.id}">${f.label}</option>`).join("")}</select>
        </div>
        <div id="areaFields"></div>
        <div id="areaOut" style="margin-top:var(--s4);"></div>
      </div></div>
    `;
  }
  function wireAreaSolver(){
    const pick = document.getElementById("areaPick");
    const fields = document.getElementById("areaFields");
    const out = document.getElementById("areaOut");
    function build(){
      const f = AREA_FORMULAS.find(x=>x.id===pick.value);
      fields.innerHTML = `<div class="grid-3">${f.vars.map(([key,label,unit])=>`
        <div class="field"><label>${label} (${unit})</label><input type="number" step="any" data-key="${key}" value=""></div>
      `).join("")}</div><p class="hint" style="margin-top:var(--s2);">Leave exactly one field blank — that's the one it solves for.</p>`;
      fields.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => compute(f)));
      compute(f);
    }
    function compute(f){
      const inputs = Array.from(fields.querySelectorAll("input"));
      const blanks = inputs.filter(i => i.value.trim()==="");
      if (blanks.length !== 1){ out.innerHTML = `<p class="hint">${blanks.length===0?"All fields filled — clear one to solve for it.":"Leave exactly one field blank."}</p>`; return; }
      const missing = blanks[0].dataset.key;
      const known = {};
      inputs.forEach(i => { if (i.dataset.key !== missing) known[i.dataset.key] = parseFloat(i.value); });
      const result = f.solve(known, missing);
      if (!isFinite(result)){ out.innerHTML = `<p class="err">No valid solution for these values.</p>`; return; }
      out.innerHTML = `<p class="prose" style="font-size:var(--t-sm);">Rearranged: <strong class="tabular">${f.rearranged[missing]}</strong></p>
        <p style="font-size:var(--t-md);font-weight:600;">${missing} = <span class="tabular">${Number(result.toPrecision(6))}</span></p>`;
    }
    pick.addEventListener("change", build);
    build();
  }
  function renderGeometry(){
    return `
      <div class="grid-2">
        <div class="sheet"><div class="sheet-head">Angle rules</div><div class="sheet-body table-wrap">
          <table>${ANGLE_RULES.map(r=>`<tr><td style="font-weight:600;white-space:nowrap;">${r.name}</td><td>${r.desc}</td></tr>`).join("")}</table>
        </div></div>
        <div class="sheet"><div class="sheet-head">2D shape properties</div><div class="sheet-body table-wrap">
          <table><thead><tr><th>Shape</th><th>Sides</th><th>Angle sum</th><th>Notes</th></tr></thead>
          <tbody>${SHAPES_2D.map(s=>`<tr><td style="font-weight:600;">${s.name}</td><td class="tabular">${s.sides}</td><td class="tabular">${s.angleSum}</td><td>${s.note}</td></tr>`).join("")}</tbody></table>
        </div></div>
      </div>
      <div class="sheet"><div class="sheet-head">3D shape properties</div><div class="sheet-body table-wrap">
        <table><thead><tr><th>Shape</th><th>Faces</th><th>Edges</th><th>Vertices</th></tr></thead>
        <tbody>${SHAPES_3D.map(s=>`<tr><td style="font-weight:600;">${s.name}</td><td class="tabular">${s.faces}</td><td class="tabular">${s.edges}</td><td class="tabular">${s.vertices}</td></tr>`).join("")}</tbody></table>
      </div></div>
      ${renderAreaSolver()}
    `;
  }

  /* ---- Statistics ---- */
  function renderStatistics(){
    return `
      <div class="sheet"><div class="sheet-head">Statistics — paste a data column</div><div class="sheet-body">
        <div class="field"><label>Data (comma, space, or newline separated)</label>
          <textarea id="statData" rows="4" style="width:100%;">12, 15, 14, 10, 18, 21, 14, 16, 9, 20</textarea>
        </div>
        <div id="statOut" style="margin-top:var(--s4);"></div>
        <div style="margin-top:var(--s4);"><p class="hint" style="margin-bottom:4px;">Bar chart</p><canvas id="statHist" width="420" height="220" style="width:100%;max-width:420px;border:1px solid var(--rule);"></canvas></div>
      </div></div>
      <div class="sheet"><div class="sheet-head">Probability</div><div class="sheet-body prose" style="font-size:var(--t-sm);">
        <ul style="padding-left:1.2em;">${PROBABILITY_NOTES.map(p=>`<li>${p}</li>`).join("")}</ul>
      </div></div>
    `;
  }
  function wireStatistics(){
    const dataEl = document.getElementById("statData"), out = document.getElementById("statOut");
    const histCanvas = document.getElementById("statHist");
    function update(){
      const nums = dataEl.value.split(/[\s,]+/).map(s=>parseFloat(s)).filter(v=>isFinite(v));
      if (nums.length < 2){ out.innerHTML = `<p class="err">Enter at least two numbers.</p>`; return; }
      const sorted = [...nums].sort((a,b)=>a-b);
      const n = nums.length;
      const mean = nums.reduce((a,b)=>a+b,0)/n;
      const modeMap = {}; nums.forEach(v=>modeMap[v]=(modeMap[v]||0)+1);
      const maxFreq = Math.max(...Object.values(modeMap));
      const modes = Object.keys(modeMap).filter(k=>modeMap[k]===maxFreq).map(Number);
      const median = n%2 ? sorted[(n-1)/2] : (sorted[n/2-1]+sorted[n/2])/2;
      const range = sorted[n-1]-sorted[0];
      out.innerHTML = `
        <div class="table-wrap"><table>
          <tr><td>n</td><td class="tabular">${n}</td></tr>
          <tr><td>Mean</td><td class="tabular">${mean.toFixed(4)}</td></tr>
          <tr><td>Median</td><td class="tabular">${median}</td></tr>
          <tr><td>Mode</td><td class="tabular">${modes.length===Object.keys(modeMap).length?"none (all unique)":modes.join(", ")}</td></tr>
          <tr><td>Range</td><td class="tabular">${range}</td></tr>
        </table></div>
      `;
      drawHist(histCanvas, sorted);
    }
    function drawHist(canvas, sorted){
      const ctx = canvas.getContext("2d"); const W=canvas.width, H=canvas.height;
      ctx.clearRect(0,0,W,H);
      const min=sorted[0], max=sorted[sorted.length-1];
      const bins = Math.max(4, Math.ceil(Math.log2(sorted.length)+1));
      const width = (max-min)/bins || 1;
      const counts = Array(bins).fill(0);
      sorted.forEach(v => { let idx = Math.floor((v-min)/width); if (idx>=bins) idx=bins-1; if(idx<0) idx=0; counts[idx]++; });
      const maxCount = Math.max(...counts);
      const pad=24, plotH = H-2*pad, barW = (W-2*pad)/bins;
      ctx.fillStyle = "rgb(15,110,99)";
      counts.forEach((c,i) => { const h = maxCount? c/maxCount*plotH : 0; ctx.fillRect(pad+i*barW+2, H-pad-h, barW-4, h); });
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--rule-strong").trim();
      ctx.beginPath(); ctx.moveTo(pad,H-pad); ctx.lineTo(W-pad,H-pad); ctx.stroke();
    }
    dataEl.addEventListener("input", update);
    update();
  }

  function renderSection(id){
    const body = document.getElementById("body-maths");
    if (id==="number"){ body.innerHTML = renderNumber(); wireNumber(); }
    else if (id==="algebra"){ body.innerHTML = renderAlgebra(); wireAlgebra(); }
    else if (id==="geometry"){ body.innerHTML = renderGeometry(); wireAreaSolver(); }
    else if (id==="statistics"){ body.innerHTML = renderStatistics(); wireStatistics(); }
  }

  registerTab({
    id: "maths", label: "Maths", short: "Ma", accent: "--lilac",
    icon: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="2"/><path d="M9 4v16M4 9h16" stroke="currentColor" stroke-width="1.4"/></svg>`,
    searchEntries: SECTIONS.map(s => ({ label: s.label, keywords: s.label.toLowerCase(), route:`#maths/${s.id}`, group:"Maths" })),
    init(){
      const wrap = document.createElement("div");
      wrap.innerHTML = renderSegmented();
      document.getElementById("body-maths").before(wrap.firstElementChild);
      document.getElementById("mathSeg").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-id]");
        if (btn) router.go(`#maths/${btn.dataset.id}`);
      });
      renderSection(activeSection);
    },
    onRoute(rest){
      const id = (rest && rest[0]) || "number";
      activeSection = SECTIONS.some(s=>s.id===id) ? id : "number";
      document.querySelectorAll("#mathSeg button").forEach(b => b.setAttribute("aria-selected", b.dataset.id===activeSection));
      renderSection(activeSection);
    }
  });
})();

/* ============================================================
   BOOTSTRAP
   ============================================================ */
function boot(){
  renderRail();
  buildPanelShells();
  buildSearchIndex();
  palette.init();
  shortcutModal.init();

  let initialHash = window.location.hash;
  if (!initialHash){
    const last = store.get("lastTab", "#periodic");
    initialHash = last;
    window.location.hash = last;
  }
  router.fire();

  window.addEventListener("beforeprint", () => {});
  window.addEventListener("afterprint", () => {
    document.querySelectorAll(".panel[data-printing]").forEach(p => p.removeAttribute("data-printing"));
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
</body>
</html>
